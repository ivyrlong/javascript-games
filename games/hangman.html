<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Hangman – Faithful Companion Games</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="../styles.css" />

  <style>
    .fc-game-screen{
      min-height:100vh;
      background:var(--dove-white);
      display:flex;
      flex-direction:column;
      align-items:center;
      padding:16px;
    }
    .fc-game-box{
      margin-top:12px;
      width:100%;
      max-width:980px;
      border-radius:20px;
      background:#fff;
      box-shadow:0 4px 10px rgba(60,63,74,.15);
      padding:16px;
    }
    .fc-game-heading{
      margin:0 0 6px;
      font-size:1.4rem;
      color:var(--scripture-slate);
      text-align:center;
    }
    .fc-game-instructions{
      margin:0 0 12px;
      font-size:.95rem;
      color:rgba(60,63,74,.85);
      text-align:center;
    }

    .hm-top{
      display:flex;
      flex-wrap:wrap;
      gap:10px;
      justify-content:center;
      align-items:center;
      padding:10px;
      border-radius:16px;
      background:radial-gradient(circle at left,
        rgba(117,207,240,.18),
        rgba(172,148,244,.10)
      );
      margin-bottom:12px;
    }
    .hm-chip{
      padding:8px 10px;
      border-radius:999px;
      background:rgba(255,213,183,.55);
      border:1px solid rgba(60,63,74,.12);
      font-weight:900;
      color:var(--scripture-slate);
      font-size:.9rem;
    }

    .hm-layout{
      display:grid;
      grid-template-columns:1fr;
      gap:12px;
      align-items:start;
    }
    @media (min-width: 900px){
      .hm-layout{ grid-template-columns: 1fr 1fr; }
    }

    .hm-panel{
      border-radius:18px;
      padding:12px;
      background:radial-gradient(circle at top left,
        rgba(117,207,240,.14),
        rgba(172,148,244,.10)
      );
      box-shadow:0 3px 8px rgba(60,63,74,.12);
    }

    .hm-title-row{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
      flex-wrap:wrap;
      margin-bottom:10px;
    }
    .hm-panel-title{
      margin:0;
      font-size:1rem;
      font-weight:1000;
      color:var(--scripture-slate);
    }

    .hm-btn{
      padding:10px 14px;
      border-radius:999px;
      border:none;
      cursor:pointer;
      font-weight:1000;
      font-size:.95rem;
      box-shadow:0 3px 8px rgba(60,63,74,.2);
      touch-action:manipulation;
      user-select:none;
      -webkit-user-select:none;
    }
    .hm-btn:active{ transform:scale(.98); }
    .hm-btn--primary{ background:var(--cheerful-coral); color:#fff; }
    .hm-btn--secondary{ background:rgba(172,148,244,.16); color:var(--scripture-slate); }

    .hm-word{
      display:flex;
      flex-wrap:wrap;
      justify-content:center;
      gap:10px;
      padding:10px;
      border-radius:16px;
      background:#fff;
      box-shadow:0 3px 10px rgba(60,63,74,.10);
      min-height:64px;
      align-items:center;
    }
    .hm-letter-slot{
      width:34px;
      height:44px;
      border-radius:12px;
      background:rgba(250,248,246,.95);
      border:1px dashed rgba(60,63,74,.22);
      display:flex;
      align-items:center;
      justify-content:center;
      font-weight:1000;
      font-size:1.2rem;
      color:var(--scripture-slate);
    }
    .hm-letter-slot--space{
      width:14px;
      border:none;
      background:transparent;
    }

    .hm-hint{
      margin-top:10px;
      padding:10px;
      border-radius:16px;
      background:rgba(243,184,64,.16);
      border:1px solid rgba(243,184,64,.40);
      color:var(--scripture-slate);
      font-weight:900;
      text-align:center;
    }

    .hm-figure{
      display:flex;
      justify-content:center;
      padding:10px;
      background:#fff;
      border-radius:16px;
      box-shadow:0 3px 10px rgba(60,63,74,.10);
    }

    .hm-status{
      margin-top:10px;
      text-align:center;
      font-weight:1000;
      color:rgba(60,63,74,.86);
      min-height:1.3em;
    }

    .hm-kb{
      display:grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap:8px;
      margin-top:10px;
    }
    @media (min-width: 520px){
      .hm-kb{ grid-template-columns: repeat(9, minmax(0, 1fr)); }
    }

    .hm-key{
      padding:12px 0;
      border-radius:14px;
      border:1px solid rgba(60,63,74,.14);
      background:#fff;
      box-shadow:0 2px 8px rgba(60,63,74,.10);
      font-weight:1000;
      color:var(--scripture-slate);
      cursor:pointer;
      touch-action:manipulation;
      user-select:none;
      -webkit-user-select:none;
    }
    .hm-key:active{ transform:scale(.98); }
    .hm-key--used{
      opacity:.45;
      cursor:default;
      box-shadow:none;
    }
    .hm-key--good{
      border-color: rgba(103,197,135,.55);
      box-shadow:0 0 0 3px rgba(103,197,135,.18) inset;
    }
    .hm-key--bad{
      border-color: rgba(255,130,105,.65);
      box-shadow:0 0 0 3px rgba(255,130,105,.16) inset;
    }

    /* Confetti */
    .hm-confetti{
      position:fixed;
      inset:0;
      pointer-events:none;
      overflow:hidden;
      z-index:9999;
    }
    .hm-confetti-piece{
      position:absolute;
      width:10px;
      height:14px;
      border-radius:3px;
      opacity:.95;
      transform: translateY(-20px) rotate(0deg);
      animation: hmFall linear forwards;
    }
    @keyframes hmFall {
      to { transform: translateY(calc(100vh + 40px)) rotate(720deg); }
    }

    /* ✅ Phone compact sizing */
    @media (max-width: 520px){
      .fc-game-screen{ padding:10px; }
      .fc-game-box{ padding:12px; }

      .hm-top{
        gap:6px;
        padding:8px;
        margin-bottom:10px;
      }
      .hm-chip{ padding:6px 8px; font-size:.85rem; }

      .hm-word{
        gap:6px;
        padding:8px;
        min-height:56px;
      }
      .hm-letter-slot{
        width:28px;
        height:38px;
        border-radius:10px;
        font-size:1.05rem;
      }
      .hm-letter-slot--space{ width:10px; }

      .hm-kb{
        grid-template-columns: repeat(7, minmax(0, 1fr));
        gap:6px;
      }
      .hm-key{
        padding:10px 0;
        border-radius:12px;
        font-size:.95rem;
      }

      .hm-hint{ padding:8px; font-size:.9rem; }
      .hm-status{ margin-top:8px; font-size:.9rem; }

      .hm-figure{ padding:8px; margin-bottom:6px; }
      #hmCanvas{
        width: 260px;
        height: 180px;
        max-width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="fc-game-screen">
    <a class="fc-back-link" href="../index.html">Back to games</a>

    <div class="fc-game-box">
      <h1 class="fc-game-heading">Hangman</h1>
      <p class="fc-game-instructions">
        Tap letters to guess the word. Try not to run out of hearts! ❤️
      </p>

      <div class="hm-top">
        <div class="hm-chip">Hearts: <span id="hmHearts">6</span></div>
        <div class="hm-chip">Wins: <span id="hmWins">0</span></div>
        <div class="hm-chip">Best streak: <span id="hmBest">0</span></div>
      </div>

      <div class="hm-layout">
        <!-- ✅ OPTION 1: Drawing panel comes FIRST in the HTML -->
        <div class="hm-panel">
          <div class="hm-title-row">
            <h2 class="hm-panel-title">🎨 Hangman</h2>
            <button class="hm-btn hm-btn--secondary" id="hmResetScoreBtn" type="button">Reset Score</button>
          </div>

          <div class="hm-figure">
            <canvas id="hmCanvas" width="300" height="260" aria-label="Hangman drawing"></canvas>
          </div>

          <div class="hm-status" style="margin-top:10px;">
            Tip: start with vowels (A, E, I, O, U).
          </div>
        </div>

        <!-- Panel 2: Word + keyboard -->
        <div class="hm-panel">
          <div class="hm-title-row">
            <h2 class="hm-panel-title">🧠 Guess the word</h2>
            <div style="display:flex; gap:8px; flex-wrap:wrap;">
              <button class="hm-btn hm-btn--secondary" id="hmHintBtn" type="button">Hint</button>
              <button class="hm-btn hm-btn--primary" id="hmNewBtn" type="button">New Word</button>
            </div>
          </div>

          <div class="hm-word" id="hmWord" aria-label="Word to guess"></div>
          <div class="hm-hint" id="hmHint" style="display:none;"></div>
          <div class="hm-status" id="hmStatus"></div>

          <div class="hm-kb" id="hmKeyboard" aria-label="Letter keyboard"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="hm-confetti" id="hmConfetti"></div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const WORDS = [
        { answer: "JEHOVAH", hint: "God’s name" },
        { answer: "BIBLE", hint: "God’s Word" },
        { answer: "PRAYER", hint: "Talking to Jehovah" },
        { answer: "KINDNESS", hint: "A good quality" },
        { answer: "LOVE", hint: "A fruitage quality" },
        { answer: "JOY", hint: "A happy feeling" },
        { answer: "PEACE", hint: "A calm feeling" },
        { answer: "DAVID", hint: "He fought Goliath" },
        { answer: "MOSES", hint: "Led Israel out of Egypt" },
        { answer: "NOAH", hint: "Built an ark" },
        { answer: "JESUS", hint: "God’s Son" },
        { answer: "GENESIS", hint: "First Bible book" },
        { answer: "PSALMS", hint: "Songs and prayers" },
        { answer: "PROVERBS", hint: "Wise sayings" }
      ];

      const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");

      const wordEl = document.getElementById('hmWord');
      const keyboardEl = document.getElementById('hmKeyboard');
      const hintEl = document.getElementById('hmHint');
      const statusEl = document.getElementById('hmStatus');

      const heartsEl = document.getElementById('hmHearts');
      const winsEl = document.getElementById('hmWins');
      const bestEl = document.getElementById('hmBest');

      const newBtn = document.getElementById('hmNewBtn');
      const hintBtn = document.getElementById('hmHintBtn');
      const resetScoreBtn = document.getElementById('hmResetScoreBtn');

      const confettiLayer = document.getElementById('hmConfetti');

      const canvas = document.getElementById('hmCanvas');
      const ctx = canvas.getContext('2d');

      const MAX_WRONG = 6;

      let current = null;
      let guessed = new Set();
      let wrong = 0;

      let wins = Number(localStorage.getItem('hmWins') || '0');
      let best = Number(localStorage.getItem('hmBest') || '0');
      let streak = Number(localStorage.getItem('hmStreak') || '0');

      function setStatus(text){ statusEl.textContent = text || ''; }

      function shuffle(arr){
        const a = arr.slice();
        for(let i=a.length-1;i>0;i--){
          const j = Math.floor(Math.random()*(i+1));
          [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
      }

      function pickWord(){
        const bag = shuffle(WORDS);
        return bag[0];
      }

      function renderFigure(){
        canvas.width = 300;
        canvas.height = 260;
        ctx.clearRect(0,0,canvas.width,canvas.height);

        ctx.lineWidth = 6;
        ctx.lineCap = "round";
        ctx.strokeStyle = "#3C3F4A";

        // base
        ctx.beginPath();
        ctx.moveTo(40, 230);
        ctx.lineTo(200, 230);
        ctx.stroke();

        // pole + top
        ctx.beginPath();
        ctx.moveTo(80, 230);
        ctx.lineTo(80, 30);
        ctx.lineTo(190, 30);
        ctx.lineTo(190, 60);
        ctx.stroke();

        // head
        if(wrong >= 1){
          ctx.beginPath();
          ctx.arc(190, 85, 25, 0, Math.PI*2);
          ctx.stroke();
        }
        // body
        if(wrong >= 2){
          ctx.beginPath();
          ctx.moveTo(190, 110);
          ctx.lineTo(190, 170);
          ctx.stroke();
        }
        // left arm
        if(wrong >= 3){
          ctx.beginPath();
          ctx.moveTo(190, 125);
          ctx.lineTo(160, 150);
          ctx.stroke();
        }
        // right arm
        if(wrong >= 4){
          ctx.beginPath();
          ctx.moveTo(190, 125);
          ctx.lineTo(220, 150);
          ctx.stroke();
        }
        // left leg
        if(wrong >= 5){
          ctx.beginPath();
          ctx.moveTo(190, 170);
          ctx.lineTo(165, 205);
          ctx.stroke();
        }
        // right leg
        if(wrong >= 6){
          ctx.beginPath();
          ctx.moveTo(190, 170);
          ctx.lineTo(215, 205);
          ctx.stroke();
        }
      }

      function renderHud(){
        const heartsLeft = Math.max(0, MAX_WRONG - wrong);
        heartsEl.textContent = String(heartsLeft);
        winsEl.textContent = String(wins);
        bestEl.textContent = String(best);
      }

      function renderWord(){
        wordEl.innerHTML = '';
        const answer = current.answer;

        for(let i=0;i<answer.length;i++){
          const ch = answer[i];
          if(ch === " "){
            const space = document.createElement('div');
            space.className = 'hm-letter-slot hm-letter-slot--space';
            wordEl.appendChild(space);
          } else {
            const slot = document.createElement('div');
            slot.className = 'hm-letter-slot';
            slot.textContent = guessed.has(ch) ? ch : '';
            wordEl.appendChild(slot);
          }
        }
      }

      function isSolved(){
        for(const ch of current.answer){
          if(ch === " ") continue;
          if(!guessed.has(ch)) return false;
        }
        return true;
      }

      function disableKeyboard(disabled=true){
        keyboardEl.querySelectorAll('button').forEach(btn => {
          btn.disabled = disabled;
          if(disabled) btn.classList.add('hm-key--used');
        });
      }

      function confettiBurst(){
        const pieceCount = 90;
        const durationMin = 1100;
        const durationMax = 1900;
        const colors = ['#75CFF0','#FFD5B7','#F3B840','#AC94F4','#FF8269','#FAF8F6'];

        for (let i = 0; i < pieceCount; i++){
          const p = document.createElement('div');
          p.className = 'hm-confetti-piece';
          p.style.background = colors[Math.floor(Math.random() * colors.length)];

          const x = Math.random() * window.innerWidth;
          const delay = Math.random() * 150;
          const duration = durationMin + Math.random() * (durationMax - durationMin);

          p.style.left = x + 'px';
          p.style.top = (-20 - Math.random() * 60) + 'px';
          p.style.animationDuration = duration + 'ms';
          p.style.animationDelay = delay + 'ms';

          const w = 8 + Math.random() * 8;
          const h = 10 + Math.random() * 10;
          p.style.width = w + 'px';
          p.style.height = h + 'px';

          confettiLayer.appendChild(p);
          setTimeout(() => p.remove(), duration + delay + 100);
        }
      }

      function buildKeyboard(){
        keyboardEl.innerHTML = '';
        letters.forEach(L => {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'hm-key';
          btn.textContent = L;
          btn.addEventListener('click', () => guessLetter(L, btn));
          keyboardEl.appendChild(btn);
        });
      }

      function markKey(btn, good){
        btn.classList.add('hm-key--used');
        btn.classList.toggle('hm-key--good', good);
        btn.classList.toggle('hm-key--bad', !good);
        btn.disabled = true;
      }

      function guessLetter(L, btn){
        if(guessed.has(L)) return;
        guessed.add(L);

        const answer = current.answer;
        const hit = answer.includes(L);

        markKey(btn, hit);

        if(hit){
          setStatus('Nice! ✅');
        } else {
          wrong++;
          setStatus('Oops — try again 🙂');
        }

        renderFigure();
        renderWord();
        renderHud();

        if(isSolved()){
          wins++;
          streak++;
          if(streak > best) best = streak;

          localStorage.setItem('hmWins', String(wins));
          localStorage.setItem('hmBest', String(best));
          localStorage.setItem('hmStreak', String(streak));

          setStatus('You got it! 🎉 Tap “New Word” to play again.');
          confettiBurst();
          disableKeyboard(true);
        } else if(wrong >= MAX_WRONG){
          streak = 0;
          localStorage.setItem('hmStreak', String(streak));
          setStatus(`Out of hearts. The word was: ${current.answer}`);
          disableKeyboard(true);
        }
      }

      function toggleHint(){
        if(hintEl.style.display === 'none'){
          hintEl.style.display = 'block';
          hintEl.textContent = `Hint: ${current.hint}`;
        } else {
          hintEl.style.display = 'none';
        }
      }

      function newGame(){
        current = pickWord();
        guessed = new Set();
        wrong = 0;
        hintEl.style.display = 'none';
        setStatus('Tap a letter to start!');
        renderFigure();
        renderHud();
        renderWord();
        buildKeyboard();
      }

      function resetScores(){
        wins = 0;
        best = 0;
        streak = 0;
        localStorage.setItem('hmWins','0');
        localStorage.setItem('hmBest','0');
        localStorage.setItem('hmStreak','0');
        renderHud();
        setStatus('Scores reset.');
      }

      window.addEventListener('keydown', (e) => {
        const k = (e.key || '').toUpperCase();
        if(k.length === 1 && k >= 'A' && k <= 'Z'){
          const btn = Array.from(keyboardEl.querySelectorAll('button')).find(b => b.textContent === k);
          if(btn && !btn.disabled) btn.click();
        }
      });

      newBtn.addEventListener('click', newGame);
      hintBtn.addEventListener('click', toggleHint);
      resetScoreBtn.addEventListener('click', resetScores);

      renderHud();
      newGame();
    });
  </script>
</body>
</html>
