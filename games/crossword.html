<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Crossword – Faithful Companion Games</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="../styles.css" />

  <style>
    :root{
      --bg: var(--dove-white, #FAF8F6);
      --ink: var(--scripture-slate, #3C3F4A);
      --sky: var(--spiritual-sky, #75CFF0);
      --violet: var(--faithful-violet, #AC94F4);
      --peach: var(--joyful-peach, #FFD5B7);
      --coral: var(--cheerful-coral, #FF8269);

      --card: #fff;
      --line: rgba(60,63,74,.12);

      /* board sizing (JS updates these) */
      --cell: 28px;
      --gap: 6px;
      --ring: 3px;
    }

    *{ box-sizing:border-box; }
    body{
      margin:0;
      background: var(--bg);
      color: var(--ink);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      overflow-x:hidden; /* no horizontal bleed */
    }

    .fc-game-screen{
      min-height:100vh;
      display:flex;
      flex-direction:column;
      align-items:center;
      padding:16px;
      padding-bottom: calc(16px + env(safe-area-inset-bottom));
    }

    .fc-back-link{
      align-self:flex-start;
      text-decoration:none;
      font-weight:900;
      color: rgba(255,130,105,.85);
      padding:8px 10px;
      border-radius:999px;
      background: rgba(255,213,183,.35);
      border: 1px solid rgba(60,63,74,.10);
    }

    .fc-game-box{
      width:100%;
      max-width:980px;
      margin-top:12px;
      border-radius:22px;
      background: var(--card);
      border:1px solid var(--line);
      box-shadow: 0 6px 18px rgba(60,63,74,.10);
      padding:16px;
      overflow:hidden; /* clean container */
    }

    .fc-game-heading{
      margin: 6px 0 4px;
      font-size: 1.65rem;
      font-weight: 1000;
      text-align:center;
    }
    .fc-game-instructions{
      margin:0 0 14px;
      text-align:center;
      color: rgba(60,63,74,.78);
      font-weight:650;
      line-height:1.25;
    }

    .cw-controls{
      display:flex;
      flex-wrap:wrap;
      gap:10px;
      justify-content:center;
      align-items:center;
      margin:12px 0 14px;
      padding:12px;
      border-radius:18px;
      background: radial-gradient(circle at left,
        rgba(117,207,240,.18),
        rgba(172,148,244,.12),
        rgba(255,213,183,.22)
      );
      border: 1px solid rgba(60,63,74,.08);
    }

    .cw-btn{
      padding:10px 16px;
      border-radius:999px;
      border:none;
      cursor:pointer;
      font-weight:900;
      font-size:.98rem;
      box-shadow:0 6px 16px rgba(60,63,74,.14);
      touch-action:manipulation;
      white-space:nowrap;
    }
    .cw-btn:active{ transform: scale(.98); }
    .cw-btn--primary{ background: var(--coral); color:#fff; }
    .cw-btn--secondary{ background: rgba(172,148,244,.18); color: var(--ink); }
    .cw-btn--ghost{ background: rgba(117,207,240,.18); color: var(--ink); }

    .cw-meta{
      display:flex;
      flex-wrap:wrap;
      justify-content:space-between;
      align-items:center;
      gap:10px;
      margin: 10px 0 8px;
      padding: 10px 12px;
      border-radius: 16px;
      background: rgba(117,207,240,.10);
      border: 1px solid rgba(60,63,74,.08);
    }
    .cw-chip{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:8px 10px;
      border-radius:999px;
      background: rgba(255,213,183,.40);
      border: 1px solid rgba(60,63,74,.10);
      font-weight: 900;
      color: rgba(60,63,74,.88);
      font-size:.92rem;
      white-space:nowrap;
    }
    .cw-chip strong{ font-weight:1100; }
    .cw-direction{
      font-weight: 1000;
      color: rgba(60,63,74,.70);
      font-size:.92rem;
      white-space:nowrap;
    }

    .cw-board-card{
      margin-top: 10px;
      border-radius: 22px;
      background: radial-gradient(circle at top left,
        rgba(117,207,240,.18),
        rgba(172,148,244,.10)
      );
      padding: 14px;
      border: 1px solid rgba(60,63,74,.08);
      box-shadow: 0 10px 24px rgba(60,63,74,.08);
      overflow:hidden;
    }

    .cw-board-head{
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      gap:10px;
      margin-bottom:10px;
    }
    .cw-board-title{
      margin:0;
      font-weight:1100;
      font-size:1.15rem;
    }
    .cw-board-sub{
      margin:2px 0 0;
      font-weight:800;
      color: rgba(60,63,74,.68);
      font-size:.92rem;
      line-height:1.2;
    }

    .cw-board-viewport{
      width:100%;
      display:flex;
      justify-content:center;
      overflow:hidden; /* prevents bleed */
      padding: 6px 0 2px;
    }

    .cw-board{
      display:grid;
      grid-template-columns: repeat(var(--cols), var(--cell));
      grid-template-rows: repeat(var(--rows), var(--cell));
      gap: var(--gap);
      padding: 10px;
      border-radius: 18px;
      background: rgba(255,255,255,.70);
      border: 1px solid rgba(60,63,74,.08);
      box-shadow: 0 10px 18px rgba(60,63,74,.08);
      overflow:hidden;
      touch-action: manipulation;
      max-width:100%;
    }

    .cw-tile{
      width: var(--cell);
      height: var(--cell);
      border-radius: 999px;
      background: rgba(250,248,246,.95);
      border: 2px solid rgba(60,63,74,.10);
      box-shadow: inset 0 0 0 3px rgba(255,255,255,.60);
      display:flex;
      align-items:center;
      justify-content:center;
      position:relative;
      user-select:none;
      -webkit-user-select:none;
    }

    .cw-tile.blank{
      opacity:0;
      border-color: transparent;
      box-shadow:none;
      background: transparent;
      pointer-events:none;
    }

    .cw-tile .num{
      position:absolute;
      top: -6px;
      left: -4px;
      font-size: .62rem;
      font-weight: 1000;
      color: rgba(60,63,74,.55);
      transform: scale(.95);
      pointer-events:none;
    }

    .cw-tile .ch{
      font-weight:1100;
      font-size: calc(var(--cell) * .48);
      line-height:1;
      color: rgba(60,63,74,.90);
      transform: translateY(1px);
    }

    .cw-tile.active{
      border-color: rgba(117,207,240,.95);
      box-shadow: 0 0 0 var(--ring) rgba(117,207,240,.18);
    }
    .cw-tile.inword{
      border-color: rgba(243,184,64,.80);
    }
    .cw-tile.locked{
      border-color: rgba(103,197,135,.70);
      background: rgba(103,197,135,.10);
    }

    .cw-clues{
      margin-top: 12px;
      border-radius: 22px;
      background: rgba(117,207,240,.10);
      border: 1px solid rgba(60,63,74,.08);
      box-shadow: 0 10px 24px rgba(60,63,74,.08);
      overflow:hidden;
    }
    .cw-clues-head{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
      padding: 12px 14px;
      background: rgba(255,255,255,.60);
      border-bottom: 1px solid rgba(60,63,74,.08);
      font-weight: 1100;
    }
    .cw-clues-list{
      padding: 10px;
      display:flex;
      flex-direction:column;
      gap:10px;
    }
    .cw-clue{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      padding: 12px 12px;
      border-radius: 18px;
      background: rgba(255,255,255,.86);
      border: 1px solid rgba(60,63,74,.10);
      box-shadow: 0 10px 18px rgba(60,63,74,.06);
      cursor:pointer;
      touch-action: manipulation;
    }
    .cw-clue:active{ transform: scale(.995); }
    .cw-clue .left{
      display:flex;
      align-items:center;
      gap:10px;
      min-width:0;
    }
    .cw-clue .emoji{
      width: 40px; height: 40px;
      border-radius: 16px;
      display:flex;
      align-items:center;
      justify-content:center;
      background: rgba(255,213,183,.42);
      border: 1px solid rgba(60,63,74,.08);
      flex: 0 0 auto;
      font-size: 1.25rem;
    }
    .cw-clue .txt{ min-width:0; }
    .cw-clue .txt .line1{
      font-weight:1100;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .cw-clue .txt .line2{
      font-weight:900;
      color: rgba(60,63,74,.65);
      font-size:.88rem;
      margin-top:2px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .cw-clue.active{
      outline: 3px solid rgba(255,130,105,.25);
      border-color: rgba(255,130,105,.55);
    }

    /* Drawer */
    .cw-drawer-scrim{
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.25);
      opacity:0;
      pointer-events:none;
      transition: opacity .15s ease;
      z-index: 999;
    }
    .cw-drawer-scrim.open{
      opacity:1;
      pointer-events:auto;
    }

    .cw-drawer{
      position: fixed;
      left:0; right:0; bottom:0;
      z-index: 1000;
      padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
      transform: translateY(105%);
      transition: transform .18s ease;
    }
    .cw-drawer.open{ transform: translateY(0); }

    .cw-drawer-inner{
      max-width: 980px;
      margin: 0 auto;
      border-radius: 22px;
      background: rgba(250,248,246,.92);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(60,63,74,.10);
      box-shadow: 0 -10px 24px rgba(60,63,74,.14);
      overflow:hidden;
    }

    .cw-drawer-head{
      position:relative;
      padding: 12px 44px 12px 14px;
      background: rgba(255,255,255,.72);
      border-bottom: 1px solid rgba(60,63,74,.10);
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
      min-height: 52px;
    }
    .cw-drawer-title{
      font-weight:1100;
      color: rgba(60,63,74,.88);
      line-height:1.15;
      font-size: .98rem;
      padding: 0 4px;
      max-width: 100%;
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
    }
    .cw-drawer-close{
      position:absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      width: 34px;
      height: 34px;
      border-radius: 12px;
      border: 1px solid rgba(60,63,74,.12);
      background: rgba(172,148,244,.16);
      color: rgba(60,63,74,.85);
      font-weight: 1100;
      font-size: 1.05rem;
      cursor:pointer;
      display:flex;
      align-items:center;
      justify-content:center;
      touch-action: manipulation;
    }
    .cw-drawer-close:active{ transform: translateY(-50%) scale(.98); }

    .cw-letters{
      padding: 12px;
      display:grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 10px;
      background: radial-gradient(circle at left,
        rgba(117,207,240,.16),
        rgba(172,148,244,.10),
        rgba(255,213,183,.18)
      );
    }

    .cw-letter-btn{
      border:none;
      border-radius: 999px;
      background: rgba(255,213,183,.70);
      border: 1px solid rgba(60,63,74,.10);
      box-shadow: 0 10px 18px rgba(60,63,74,.08);
      height: 52px;
      font-weight: 1100;
      font-size: 1.05rem;
      cursor:pointer;
      touch-action: manipulation;
    }
    .cw-letter-btn:active{ transform: scale(.99); }
    .cw-letter-btn.alt{ background: rgba(172,148,244,.20); }

    .cw-status{
      margin-top: 10px;
      text-align:center;
      font-weight: 900;
      color: rgba(60,63,74,.75);
      min-height: 1.2em;
    }

    @media (max-width: 420px){
      .cw-letter-btn{ height: 48px; }
      .cw-drawer-title{ font-size: .95rem; }
    }
  </style>
</head>

<body>
  <div class="fc-game-screen">
    <a class="fc-back-link" href="../index.html">← Back to games</a>

    <div class="fc-game-box">
      <h1 class="fc-game-heading">Tap-to-Type Crossword</h1>
      <p class="fc-game-instructions">
        Tap a clue to jump to its word. Or tap a circle to select it.
        Tap the same circle again to switch <strong>Across ↔ Down</strong>.
      </p>

      <div class="cw-controls">
        <button class="cw-btn cw-btn--primary" id="newBtn" type="button">New Crossword</button>
        <button class="cw-btn cw-btn--secondary" id="hintBtn" type="button">Hint (1 letter)</button>
        <button class="cw-btn cw-btn--ghost" id="clearBtn" type="button">Clear word</button>
        <button class="cw-btn cw-btn--secondary" id="guidedBtn" type="button" aria-pressed="true">Guided: ON</button>
      </div>

      <div class="cw-meta">
        <div class="cw-chip">🧩 Theme: <strong id="themeText">Mix</strong></div>
        <div class="cw-chip">🔒 Words locked: <strong id="lockedCount">0</strong>/<strong id="wordCount">0</strong></div>
        <div class="cw-direction">Direction: <strong id="dirText">ACROSS</strong></div>
      </div>

      <div class="cw-board-card" id="boardCard">
        <div class="cw-board-head">
          <div>
            <h2 class="cw-board-title">🧩 Crossword</h2>
            <div class="cw-board-sub" id="boardSub">Tap a clue (or a square) to begin!</div>
          </div>
        </div>

        <div class="cw-board-viewport">
          <div class="cw-board" id="board" style="--rows: 1; --cols: 1;"></div>
        </div>

        <div class="cw-status" id="status"></div>
      </div>

      <div class="cw-clues">
        <div class="cw-clues-head">
          <div>📝 Clues</div>
          <div style="font-weight:900; color:rgba(60,63,74,.65);">Tap to go there</div>
        </div>
        <div class="cw-clues-list" id="cluesList"></div>
      </div>
    </div>
  </div>

  <!-- Drawer -->
  <div class="cw-drawer-scrim" id="scrim" aria-hidden="true"></div>
  <div class="cw-drawer" id="drawer" aria-hidden="true">
    <div class="cw-drawer-inner">
      <div class="cw-drawer-head">
        <div class="cw-drawer-title" id="drawerTitle"></div>
        <button class="cw-drawer-close" id="drawerClose" type="button" aria-label="Close">✕</button>
      </div>
      <div class="cw-letters" id="lettersGrid"></div>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // ---------------------------
      // Puzzle bank
      // ---------------------------
      const PUZZLES = [
        {
          theme: "Mix",
          entries: [
            { answer: "ESTHER", clue: "Brave queen", dir: "across", emoji: "👑" },
            { answer: "PETER", clue: "Fisherman apostle", dir: "down", emoji: "🐟" },
            { answer: "NOAH", clue: "Built the ark", dir: "across", emoji: "⛵" },
            { answer: "TREE", clue: "Tall plant", dir: "down", emoji: "🌳" },
            { answer: "SUN", clue: "Made the day bright", dir: "down", emoji: "💡" },
            { answer: "PAUL", clue: "Wrote letters", dir: "across", emoji: "🧾" },
            { answer: "MOSES", clue: "Led Israel", dir: "down", emoji: "🪵" },
            { answer: "LAMB", clue: "Gentle animal", dir: "across", emoji: "🐑" },
            { answer: "STAR", clue: "Shines at night", dir: "down", emoji: "⭐" },
          ]
        },
        {
          theme: "Encouragement",
          entries: [
            { answer: "HOPE", clue: "Do not give up", dir: "across", emoji: "🌟" },
            { answer: "LOVE", clue: "Show it", dir: "down", emoji: "💛" },
            { answer: "FAITH", clue: "Trust Jehovah", dir: "across", emoji: "🕊️" },
            { answer: "PRAY", clue: "Talk to God", dir: "down", emoji: "🙏" },
            { answer: "BIBLE", clue: "God’s Word", dir: "across", emoji: "📖" },
            { answer: "KIND", clue: "Be this", dir: "down", emoji: "🌿" },
            { answer: "PEACE", clue: "Calm feeling", dir: "across", emoji: "🫶" },
          ]
        }
      ];

      // ---------------------------
      // UI refs
      // ---------------------------
      const boardEl = document.getElementById('board');
      const cluesListEl = document.getElementById('cluesList');
      const themeTextEl = document.getElementById('themeText');
      const lockedCountEl = document.getElementById('lockedCount');
      const wordCountEl = document.getElementById('wordCount');
      const dirTextEl = document.getElementById('dirText');
      const boardSubEl = document.getElementById('boardSub');
      const statusEl = document.getElementById('status');

      const newBtn = document.getElementById('newBtn');
      const hintBtn = document.getElementById('hintBtn');
      const clearBtn = document.getElementById('clearBtn');
      const guidedBtn = document.getElementById('guidedBtn');

      const drawer = document.getElementById('drawer');
      const scrim = document.getElementById('scrim');
      const drawerTitle = document.getElementById('drawerTitle');
      const drawerClose = document.getElementById('drawerClose');
      const lettersGrid = document.getElementById('lettersGrid');

      // ---------------------------
      // State
      // ---------------------------
      let guided = true;
      let grid = new Map();     // "r,c" => cell
      let placed = [];          // placed words (and skipped shown as unused)
      let display = { r0:0, c0:0, r1:0, c1:0, rows:1, cols:1 };
      let active = { r:null, c:null, dir:'across', wordId:null };

      // ---------------------------
      // Helpers
      // ---------------------------
      const keyRC = (r,c) => `${r},${c}`;
      const getCell = (r,c) => grid.get(keyRC(r,c)) || null;
      const setCell = (r,c, cell) => grid.set(keyRC(r,c), cell);
      const isFilled = (r,c) => !!getCell(r,c);

      function setStatus(msg){ statusEl.textContent = msg || ''; }
      function randPick(arr){ return arr[Math.floor(Math.random() * arr.length)]; }

      function shuffle(arr){
        const a = arr.slice();
        for (let i=a.length-1;i>0;i--){
          const j = Math.floor(Math.random()*(i+1));
          [a[i],a[j]] = [a[j],a[i]];
        }
        return a;
      }

      // ---------------------------
      // Spacing rules (prevents accidental groupings)
      // ---------------------------
      function canPlaceWord(answer, dir, r, c){
        const len = answer.length;

        // end caps must be blank
        if (dir === 'across'){
          if (isFilled(r, c-1)) return false;
          if (isFilled(r, c+len)) return false;
        } else {
          if (isFilled(r-1, c)) return false;
          if (isFilled(r+len, c)) return false;
        }

        for (let i=0;i<len;i++){
          const rr = dir === 'across' ? r : r+i;
          const cc = dir === 'across' ? c+i : c;

          const existing = getCell(rr,cc);
          const ch = answer[i];

          if (existing && existing.sol !== ch) return false;

          // adjacency rules only when placing into EMPTY cell
          if (!existing){
            if (dir === 'across'){
              if (isFilled(rr-1, cc)) return false;
              if (isFilled(rr+1, cc)) return false;
            } else {
              if (isFilled(rr, cc-1)) return false;
              if (isFilled(rr, cc+1)) return false;
            }
          }
        }
        return true;
      }

      function placeWord(entry, dir, r, c, id){
        const answer = entry.answer;
        const len = answer.length;

        for (let i=0;i<len;i++){
          const rr = dir === 'across' ? r : r+i;
          const cc = dir === 'across' ? c+i : c;

          const existing = getCell(rr,cc);
          if (!existing){
            setCell(rr,cc, {
              sol: answer[i],
              user: '',
              locked: false,
              num: null,
              acrossId: null,
              downId: null
            });
          }
          const cell = getCell(rr,cc);
          if (dir === 'across') cell.acrossId = id;
          else cell.downId = id;
        }

        placed.push({
          id, answer,
          clue: entry.clue,
          emoji: entry.emoji,
          dir, r, c,
          len
        });
      }

      // ---------------------------
      // Compute trimmed display bounds (with small margin)
      // ---------------------------
      function computeBounds(){
        let r0 = Infinity, c0 = Infinity, r1 = -Infinity, c1 = -Infinity;
        for (const k of grid.keys()){
          const [r,c] = k.split(',').map(Number);
          r0 = Math.min(r0,r);
          c0 = Math.min(c0,c);
          r1 = Math.max(r1,r);
          c1 = Math.max(c1,c);
        }
        if (!isFinite(r0)){
          display = { r0:0,c0:0,r1:0,c1:0,rows:1,cols:1 };
          return;
        }
        const margin = 2;
        r0 -= margin; c0 -= margin; r1 += margin; c1 += margin;
        display = { r0, c0, r1, c1, rows: (r1-r0+1), cols: (c1-c0+1) };
      }

      // ---------------------------
      // Fit-to-screen sizing
      // ---------------------------
      function fitBoardToScreen(){
        const cols = display.cols;
        const rows = display.rows;
        const gap = 6;

        const viewportW = Math.min(window.innerWidth, 980) - 32;
        const viewportH = Math.max(240, window.innerHeight * 0.46);

        const cellW = Math.floor((viewportW - (gap * (cols-1)) - 24) / cols);
        const cellH = Math.floor((viewportH - (gap * (rows-1)) - 24) / rows);
        const cell = Math.max(18, Math.min(34, Math.min(cellW, cellH)));

        document.documentElement.style.setProperty('--cell', cell + 'px');
        document.documentElement.style.setProperty('--gap', gap + 'px');
        boardEl.style.setProperty('--rows', rows);
        boardEl.style.setProperty('--cols', cols);
      }

      // ---------------------------
      // Numbering
      // ---------------------------
      function assignNumbers(){
        const starts = [];
        for (let rr = display.r0; rr <= display.r1; rr++){
          for (let cc = display.c0; cc <= display.c1; cc++){
            const cell = getCell(rr,cc);
            if (!cell) continue;

            const startAcross = cell.acrossId && !isFilled(rr,cc-1);
            const startDown   = cell.downId && !isFilled(rr-1,cc);
            if (startAcross || startDown) starts.push({r:rr,c:cc});
          }
        }

        starts.sort((a,b)=> (a.r-b.r) || (a.c-b.c));
        let n = 1;
        for (const s of starts){
          const cell = getCell(s.r,s.c);
          if (cell.num == null) cell.num = n++;
        }
      }

      // ---------------------------
      // CONNECTED GENERATOR (no islands)
      // Rule: every word after the first MUST CROSS an existing letter.
      // If it can’t, it is marked "unused in this puzzle".
      // Also: we retry multiple times and keep the best (most words placed).
      // ---------------------------
      function tryGenerateConnected(entries){
        grid = new Map();
        placed = [];
        active = { r:null, c:null, dir:'across', wordId:null };

        const items = entries
          .map(e => ({
            ...e,
            answer: e.answer.toUpperCase().replace(/[^A-Z]/g,'')
          }))
          .filter(e => e.answer.length >= 3);

        // shuffle + bias to longer first
        const shuffled = shuffle(items).sort((a,b)=> b.answer.length - a.answer.length);

        let idCounter = 1;

        // place first word near center
        const first = shuffled[0];
        const firstDir = first.dir || 'across';
        const startR = 0;
        const startC = Math.floor(-first.answer.length/2);
        placeWord(first, firstDir, startR, startC, idCounter++);

        // place remaining: MUST cross
        for (let idx=1; idx<shuffled.length; idx++){
          const w = shuffled[idx];
          const answer = w.answer;

          let placedOk = false;

          // try both directions (preferred first)
          const pref = (w.dir || 'across');
          const dirOrder = pref === 'across' ? ['across','down'] : ['down','across'];

          for (const dir of dirOrder){
            // find any crossing opportunity
            for (let i=0; i<answer.length && !placedOk; i++){
              const ch = answer[i];

              for (const [k, cell] of grid.entries()){
                if (cell.sol !== ch) continue;
                const [rr,cc] = k.split(',').map(Number);

                const r0 = dir === 'across' ? rr : rr - i;
                const c0 = dir === 'across' ? cc - i : cc;

                // IMPORTANT: ensure we are actually crossing at least one EXISTING cell
                // (placing purely in empty space is forbidden)
                if (!getCell(rr,cc)) continue;

                if (canPlaceWord(answer, dir, r0, c0)){
                  placeWord(w, dir, r0, c0, idCounter++);
                  placedOk = true;
                  break;
                }
              }
            }
          }

          if (!placedOk){
            // mark as unused (still show clue forever)
            placed.push({
              id: idCounter++,
              answer,
              clue: w.clue,
              emoji: w.emoji,
              dir: pref,
              r: null,
              c: null,
              len: answer.length,
              unused: true
            });
          }
        }

        computeBounds();
        assignNumbers();

        // count real placed words
        const usedCount = placed.filter(w => w.r != null).length;
        return { usedCount };
      }

      function generateBestConnected(puzzle){
        const entries = puzzle.entries;
        let best = null;

        // try multiple times, keep layout with most placed words
        for (let attempt=0; attempt<14; attempt++){
          const snap = snapshotState();
          const res = tryGenerateConnected(entries);
          const score = res.usedCount;

          if (!best || score > best.score){
            best = { score, state: snapshotState() };
          }

          // restore snapshot so attempts don't accumulate
          restoreState(snap);
        }

        // apply best state
        if (best){
          restoreState(best.state);
          computeBounds();
          assignNumbers();
        }
      }

      function snapshotState(){
        return {
          grid: new Map(Array.from(grid.entries()).map(([k,v]) => [k, { ...v }])),
          placed: placed.map(w => ({ ...w })),
          active: { ...active },
          display: { ...display }
        };
      }

      function restoreState(s){
        grid = new Map(Array.from(s.grid.entries()).map(([k,v]) => [k, { ...v }]));
        placed = s.placed.map(w => ({ ...w }));
        active = { ...s.active };
        display = { ...s.display };
      }

      // ---------------------------
      // Rendering
      // ---------------------------
      function renderBoard(){
        boardEl.innerHTML = '';
        boardEl.style.setProperty('--rows', display.rows);
        boardEl.style.setProperty('--cols', display.cols);
        fitBoardToScreen();

        const inActiveWord = new Set();
        if (active.wordId != null){
          for (let rr = display.r0; rr <= display.r1; rr++){
            for (let cc = display.c0; cc <= display.c1; cc++){
              const cell = getCell(rr,cc);
              if (!cell) continue;
              if ((active.dir === 'across' && cell.acrossId === active.wordId) ||
                  (active.dir === 'down' && cell.downId === active.wordId)){
                inActiveWord.add(keyRC(rr,cc));
              }
            }
          }
        }

        for (let rr = display.r0; rr <= display.r1; rr++){
          for (let cc = display.c0; cc <= display.c1; cc++){
            const cell = getCell(rr,cc);
            const tile = document.createElement('div');
            tile.className = 'cw-tile';

            if (!cell){
              tile.classList.add('blank');
              boardEl.appendChild(tile);
              continue;
            }

            if (cell.num != null){
              const num = document.createElement('div');
              num.className = 'num';
              num.textContent = cell.num;
              tile.appendChild(num);
            }

            const ch = document.createElement('div');
            ch.className = 'ch';
            ch.textContent = (cell.user || '');
            tile.appendChild(ch);

            if (cell.locked) tile.classList.add('locked');
            if (inActiveWord.has(keyRC(rr,cc))) tile.classList.add('inword');
            if (active.r === rr && active.c === cc) tile.classList.add('active');

            tile.addEventListener('click', () => {
              if (cell.locked) { setStatus('That word is locked ✅'); return; }

              if (active.r === rr && active.c === cc){
                active.dir = (active.dir === 'across') ? 'down' : 'across';
              } else {
                active.r = rr;
                active.c = cc;
                if (cell[active.dir + 'Id'] == null){
                  active.dir = cell.acrossId != null ? 'across' : 'down';
                }
              }

              const newCell = getCell(active.r, active.c);
              active.wordId = active.dir === 'across' ? newCell.acrossId : newCell.downId;
              dirTextEl.textContent = active.dir.toUpperCase();

              renderAll();
              openDrawerForActive();
            });

            boardEl.appendChild(tile);
          }
        }
      }

      function renderClues(){
        cluesListEl.innerHTML = '';

        const clueItems = placed.slice().sort((a,b)=>{
          const na = (a.r==null) ? 9999 : (getCell(a.r,a.c)?.num ?? 9999);
          const nb = (b.r==null) ? 9999 : (getCell(b.r,b.c)?.num ?? 9999);
          if (na !== nb) return na - nb;
          if (a.dir !== b.dir) return a.dir === 'across' ? -1 : 1;
          return a.answer.localeCompare(b.answer);
        });

        for (const w of clueItems){
          const num = (w.r==null) ? "—" : (getCell(w.r,w.c)?.num ?? "—");
          const dir = (w.dir || 'across').toUpperCase();

          const row = document.createElement('div');
          row.className = 'cw-clue';

          const left = document.createElement('div');
          left.className = 'left';

          const emoji = document.createElement('div');
          emoji.className = 'emoji';
          emoji.textContent = w.emoji || '🧩';

          const txt = document.createElement('div');
          txt.className = 'txt';

          const l1 = document.createElement('div');
          l1.className = 'line1';
          l1.textContent = `${num}. ${w.clue}`;

          const l2 = document.createElement('div');
          l2.className = 'line2';
          l2.textContent = `${dir} • ${w.len} letters`;

          txt.appendChild(l1);
          txt.appendChild(l2);

          left.appendChild(emoji);
          left.appendChild(txt);

          const right = document.createElement('div');
          right.style.fontWeight = '1100';
          right.style.color = 'rgba(60,63,74,.55)';
          right.textContent = w.r==null ? 'unused' : '›';

          row.appendChild(left);
          row.appendChild(right);

          if (active.wordId === w.id) row.classList.add('active');

          row.addEventListener('click', () => {
            if (w.r == null){
              setStatus('That clue is unused in this puzzle (no good crossing).');
              return;
            }
            active.r = w.r;
            active.c = w.c;
            active.dir = w.dir;
            active.wordId = w.id;
            dirTextEl.textContent = active.dir.toUpperCase();
            renderAll();
            openDrawerForActive();
          });

          cluesListEl.appendChild(row);
        }
      }

      function updateLockedCount(){
        let lockedWords = 0;
        const totalWords = placed.filter(w => w.r != null).length;

        for (const w of placed){
          if (w.r == null) continue;
          const cells = getWordCells(w.id, w.dir);
          if (!cells.length) continue;
          const allLocked = cells.every(({cell}) => cell.locked);
          if (allLocked) lockedWords++;
        }

        lockedCountEl.textContent = String(lockedWords);
        wordCountEl.textContent = String(totalWords);
      }

      function renderAll(){
        renderBoard();
        renderClues();
        updateLockedCount();
      }

      // ---------------------------
      // Word helpers / input
      // ---------------------------
      function getWordById(id){
        return placed.find(w => w.id === id) || null;
      }

      function getWordCells(wordId, dir){
        const out = [];
        for (let rr = display.r0; rr <= display.r1; rr++){
          for (let cc = display.c0; cc <= display.c1; cc++){
            const cell = getCell(rr,cc);
            if (!cell) continue;
            const id = dir === 'across' ? cell.acrossId : cell.downId;
            if (id === wordId){
              out.push({ r: rr, c: cc, cell });
            }
          }
        }
        out.sort((a,b)=> dir==='across' ? (a.c-b.c) : (a.r-b.r));
        return out;
      }

      function activeWordCells(){
        if (!active.wordId) return [];
        return getWordCells(active.wordId, active.dir);
      }

      function activeIndexInWord(){
        const list = activeWordCells();
        const idx = list.findIndex(p => p.r === active.r && p.c === active.c);
        return { list, idx };
      }

      function moveToNextCell(){
        const { list, idx } = activeIndexInWord();
        if (!list.length) return;
        for (let i = Math.max(0, idx+1); i < list.length; i++){
          if (!list[i].cell.locked && (list[i].cell.user || '') === ''){
            active.r = list[i].r;
            active.c = list[i].c;
            return;
          }
        }
        if (idx >= 0 && idx+1 < list.length){
          active.r = list[idx+1].r;
          active.c = list[idx+1].c;
        }
      }

      function checkAndLockWordIfComplete(wordId, dir){
        const w = getWordById(wordId);
        if (!w || w.r == null) return false;

        const cells = getWordCells(wordId, dir);
        if (!cells.length) return false;

        const typed = cells.map(p => (p.cell.user || '')).join('');
        if (typed.length !== w.answer.length) return false;
        if ([...typed].some(ch => ch === '')) return false;

        if (typed === w.answer){
          cells.forEach(p => p.cell.locked = true);
          return true;
        }
        return false;
      }

      function openDrawerForActive(){
        if (active.r == null || active.c == null) return;
        const cell = getCell(active.r, active.c);
        if (!cell) return;

        const word = getWordById(active.wordId);
        if (word){
          drawerTitle.textContent = `${word.emoji || '🧩'} ${word.clue} • ${active.dir.toUpperCase()} • ${word.len} letters`;
        } else {
          drawerTitle.textContent = `${active.dir.toUpperCase()}`;
        }
        openDrawer();
      }

      function setLetter(letter){
        const cell = getCell(active.r, active.c);
        if (!cell || cell.locked) return;

        if (guided && letter !== cell.sol){
          setStatus('Not quite — try another letter 🙂');
          return;
        }

        cell.user = letter;
        setStatus('');

        const lockedNow = checkAndLockWordIfComplete(active.wordId, active.dir);
        if (lockedNow) setStatus('Word locked! 🎉');

        moveToNextCell();
        renderAll();
      }

      function backspace(){
        const cell = getCell(active.r, active.c);
        if (!cell || cell.locked) return;
        cell.user = '';
        setStatus('');
        renderAll();
      }

      function clearActiveWord(){
        if (!active.wordId) { setStatus('Tap a clue first.'); return; }
        const cells = activeWordCells();
        if (!cells.length) return;
        cells.forEach(p => { if (!p.cell.locked) p.cell.user = ''; });
        setStatus('Cleared this word.');
        renderAll();
      }

      function hint(){
        const cell = getCell(active.r, active.c);
        if (!cell || cell.locked) return;
        cell.user = cell.sol;
        setStatus('Hint used.');
        const lockedNow = checkAndLockWordIfComplete(active.wordId, active.dir);
        if (lockedNow) setStatus('Word locked! 🎉');
        moveToNextCell();
        renderAll();
      }

      // ---------------------------
      // Drawer
      // ---------------------------
      function buildLetters(){
        lettersGrid.innerHTML = '';
        const letters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
        for (const L of letters){
          const b = document.createElement('button');
          b.type = 'button';
          b.className = 'cw-letter-btn';
          b.textContent = L;
          b.addEventListener('click', () => setLetter(L));
          lettersGrid.appendChild(b);
        }

        const bs = document.createElement('button');
        bs.type = 'button';
        bs.className = 'cw-letter-btn alt';
        bs.textContent = '⌫';
        bs.addEventListener('click', backspace);
        lettersGrid.appendChild(bs);

        const clr = document.createElement('button');
        clr.type = 'button';
        clr.className = 'cw-letter-btn alt';
        clr.textContent = 'Clear';
        clr.addEventListener('click', backspace);
        lettersGrid.appendChild(clr);
      }

      function openDrawer(){
        scrim.classList.add('open');
        drawer.classList.add('open');
        scrim.setAttribute('aria-hidden','false');
        drawer.setAttribute('aria-hidden','false');
      }
      function closeDrawer(){
        scrim.classList.remove('open');
        drawer.classList.remove('open');
        scrim.setAttribute('aria-hidden','true');
        drawer.setAttribute('aria-hidden','true');
      }
      drawerClose.addEventListener('click', closeDrawer);
      scrim.addEventListener('click', closeDrawer);

      // ---------------------------
      // Buttons
      // ---------------------------
      newBtn.addEventListener('click', startNew);

      hintBtn.addEventListener('click', () => {
        if (active.r == null) { setStatus('Tap a clue first.'); return; }
        hint();
        openDrawerForActive();
      });

      clearBtn.addEventListener('click', () => {
        clearActiveWord();
        openDrawerForActive();
      });

      guidedBtn.addEventListener('click', () => {
        guided = !guided;
        guidedBtn.textContent = guided ? 'Guided: ON' : 'Guided: OFF';
        guidedBtn.setAttribute('aria-pressed', guided ? 'true' : 'false');
        setStatus(guided ? 'Guided mode is ON.' : 'Guided mode is OFF.');
      });

      window.addEventListener('resize', fitBoardToScreen);

      // ---------------------------
      // Start
      // ---------------------------
      function startNew(){
        const p = randPick(PUZZLES);
        themeTextEl.textContent = p.theme || 'Mix';

        // Build a connected crossword (no islands)
        generateBestConnected(p);

        buildLetters();
        dirTextEl.textContent = 'ACROSS';
        boardSubEl.textContent = 'Tap a clue (or a square) to begin!';
        setStatus('');

        // auto-select first placed word
        const firstPlaced = placed.find(w => w.r != null);
        if (firstPlaced){
          active.r = firstPlaced.r;
          active.c = firstPlaced.c;
          active.dir = firstPlaced.dir;
          active.wordId = firstPlaced.id;
          dirTextEl.textContent = active.dir.toUpperCase();
          openDrawerForActive();
        } else {
          closeDrawer();
        }

        renderAll();
        fitBoardToScreen();
      }

      startNew();
    });
  </script>
</body>
