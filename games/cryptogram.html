<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Icon Cryptogram – Faithful Companion Games</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="../styles.css" />

  <style>
    :root{
      --bg: var(--dove-white, #FAF8F6);
      --ink: var(--scripture-slate, #3C3F4A);
      --sky: var(--spiritual-sky, #75CFF0);
      --violet: var(--faithful-violet, #AC94F4);
      --peach: var(--joyful-peach, #FFD5B7);
      --gold: var(--golden-promise, #F3B840);
      --coral: var(--cheerful-coral, #FF8269);
      --card: #fff;
      --line: rgba(60,63,74,.12);

      /* small defaults (JS will shrink further if needed) */
      --cellW: 56px;
      --iconW: 32px;
      --letterH: 42px;
      --iconF: 1.0rem;
      --letterF: 1.08rem;
      --wordGap: 7px;
    }

    *{ box-sizing:border-box; }
    body{
      margin:0;
      background: var(--bg);
      color: var(--ink);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      overflow-x:hidden;
    }

    .fc-game-screen{
      min-height:100vh;
      display:flex;
      flex-direction:column;
      align-items:center;
      padding:16px;
      padding-bottom: calc(16px + env(safe-area-inset-bottom) + 86px);
    }

    .fc-back-link{
      align-self:flex-start;
      text-decoration:none;
      font-weight:900;
      color: rgba(255,130,105,.85);
      padding:8px 10px;
      border-radius:999px;
      background: rgba(255,213,183,.35);
      border: 1px solid rgba(60,63,74,.10);
    }

    .fc-game-box{
      width:100%;
      max-width:980px;
      margin-top:12px;
      border-radius:22px;
      background: var(--card);
      border:1px solid var(--line);
      box-shadow: 0 6px 18px rgba(60,63,74,.10);
      padding:16px;
    }

    .fc-game-heading{
      margin: 6px 0 4px;
      font-size: 1.55rem;
      font-weight: 1000;
      text-align:center;
    }
    .fc-game-instructions{
      margin:0 0 14px;
      text-align:center;
      color: rgba(60,63,74,.78);
      font-weight:650;
      line-height:1.25;
    }

    .cg-controls{
      display:flex;
      flex-wrap:wrap;
      gap:10px;
      justify-content:center;
      align-items:center;
      margin:12px 0 14px;
      padding:12px;
      border-radius:18px;
      background: radial-gradient(circle at left,
        rgba(117,207,240,.18),
        rgba(172,148,244,.12),
        rgba(255,213,183,.22)
      );
      border: 1px solid rgba(60,63,74,.08);
    }
    .cg-btn{
      padding:10px 14px;
      border-radius:999px;
      border:none;
      cursor:pointer;
      font-weight:900;
      font-size:.95rem;
      box-shadow:0 6px 16px rgba(60,63,74,.14);
      touch-action:manipulation;
    }
    .cg-btn:active{ transform: scale(.98); }
    .cg-btn--primary{ background: var(--coral); color:#fff; }
    .cg-btn--secondary{ background: rgba(172,148,244,.18); color: var(--ink); }
    .cg-btn--ghost{ background: rgba(117,207,240,.18); color: var(--ink); }

    .cg-meta{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
      margin: 10px 0 6px;
      padding: 10px 12px;
      border-radius: 16px;
      background: rgba(117,207,240,.10);
      border: 1px solid rgba(60,63,74,.08);
    }
    .cg-chip{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:8px 10px;
      border-radius:999px;
      background: rgba(255,213,183,.40);
      border: 1px solid rgba(60,63,74,.10);
      font-weight: 900;
      color: rgba(60,63,74,.88);
      font-size:.9rem;
      white-space:nowrap;
      max-width: 72%;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .cg-week{
      font-weight: 1000;
      color: rgba(60,63,74,.70);
      font-size:.9rem;
      white-space:nowrap;
    }

    .cg-card{
      margin-top: 12px;
      border-radius: 22px;
      background: radial-gradient(circle at top left,
        rgba(117,207,240,.18),
        rgba(172,148,244,.12)
      );
      padding: 14px;
      border: 1px solid rgba(60,63,74,.08);
      box-shadow: 0 10px 24px rgba(60,63,74,.08);
    }
    .cg-card-head{
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      gap:12px;
      margin-bottom: 8px;
    }
    .cg-card-title{
      margin:0;
      font-weight: 1100;
      font-size: 1.15rem;
    }
    .cg-card-sub{
      margin:2px 0 0;
      font-weight: 800;
      color: rgba(60,63,74,.70);
      font-size: .92rem;
    }
    .cg-progress{
      text-align:right;
      font-weight: 1000;
      color: rgba(60,63,74,.70);
      white-space:nowrap;
      font-size:.92rem;
    }

    .cg-message{
      background: rgba(255,255,255,.75);
      border-radius: 18px;
      padding: 12px;
      border: 1px solid rgba(60,63,74,.08);
      overflow:hidden; /* no bleed */
    }

    .cg-words{
      display:flex;
      flex-direction:column;
      gap: 10px;
      align-items:center;
    }

    .cg-word-wrap{
      width:100%;
      display:flex;
      justify-content:center;
      overflow:hidden;
      padding: 2px 0 6px;
    }

    /* ✅ REMOVE “pill” around word: no background/border/padding */
    .cg-word{
      display:inline-flex;
      flex-wrap:nowrap;
      gap: var(--wordGap);
      align-items:flex-start;
      max-width: 100%;
      overflow:hidden;
      flex: 0 0 auto;
      padding: 0;
      border: none;
      background: transparent;
      border-radius: 0;
    }

    /* ✅ Tiles themselves, but tighter and no extra surrounding pill */
    .cg-cell{
      width: var(--cellW);
      border-radius: 14px;
      padding: 6px 6px 8px;   /* tighter */
      background: #fff;
      border: 1px solid rgba(60,63,74,.10);
      box-shadow: 0 5px 12px rgba(60,63,74,.10);
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:flex-start;
      user-select:none;
      -webkit-user-select:none;
      flex: 0 0 auto;
      min-width: 0;
    }

    /* ✅ Icon + blank closer together: smaller margin + tighter inner sizing */
    .cg-icon{
      width: var(--iconW);
      height: var(--iconW);
      border-radius: 12px;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size: var(--iconF);
      background: rgba(255,213,183,.40);
      border: 1px solid rgba(60,63,74,.08);
      box-shadow: inset 0 0 0 2px rgba(255,255,255,.55);
      margin-bottom: 4px;     /* tighter */
      line-height:1;
    }
    .cg-letter-box{
      width: var(--iconW);
      height: var(--letterH);
      border-radius: 12px;
      display:flex;
      align-items:center;
      justify-content:center;
      font-weight: 1100;
      font-size: var(--letterF);
      color: rgba(60,63,74,.90);
      background: rgba(117,207,240,.12);
      border: 2px solid rgba(103,197,135,.55);
      box-shadow: 0 0 0 3px rgba(103,197,135,.10) inset;
    }
    .cg-letter-box--active{
      border-color: rgba(117,207,240,.95);
      box-shadow: 0 0 0 3px rgba(117,207,240,.18) inset, 0 0 0 3px rgba(117,207,240,.20);
    }
    .cg-letter-box--filled{
      border-color: rgba(103,197,135,.75);
      box-shadow: 0 0 0 3px rgba(103,197,135,.12) inset;
    }

    .cg-solved{
      margin-top: 10px;
      padding: 10px 12px;
      border-radius: 16px;
      display:inline-block;
      background: rgba(103,197,135,.18);
      border: 1px solid rgba(60,63,74,.08);
      font-weight: 1000;
    }

    .cg-completed{
      margin-top: 12px;
      border-radius: 20px;
      padding: 12px;
      background: rgba(255,255,255,.78);
      border: 1px solid rgba(60,63,74,.08);
      display:flex;
      flex-direction:column;
      align-items:flex-start;
      gap:10px;
    }
    .cg-pill{
      width:100%;
      padding: 10px 14px;
      border-radius: 16px;
      border: 1px solid rgba(60,63,74,.10);
      background: rgba(255,255,255,.95);
      font-weight: 1100;
      letter-spacing: .04em;
      text-transform: uppercase;
      box-shadow: 0 8px 16px rgba(60,63,74,.08);
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
    }

    .cg-status{
      margin: 10px 0 0;
      text-align:center;
      font-weight: 900;
      color: rgba(60,63,74,.78);
      min-height: 1.2em;
    }

    /* ---------- Icon Key Drawer (grid, no sideways scroll; vertical scroll allowed) ---------- */
    .cg-drawer{
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 999;
      padding: 0 12px calc(10px + env(safe-area-inset-bottom));
      pointer-events: none;
    }

    .cg-drawer-inner{
      max-width: 980px;
      margin: 0 auto;
      border-radius: 18px 18px 0 0;
      background: rgba(250,248,246,.92);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(60,63,74,.10);
      box-shadow: 0 -10px 24px rgba(60,63,74,.10);
      overflow:hidden;
      pointer-events: auto;
    }

    .cg-drawer-head{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      padding: 10px 12px;
      background: radial-gradient(circle at left,
        rgba(117,207,240,.18),
        rgba(172,148,244,.10),
        rgba(255,213,183,.22)
      );
      border-bottom: 1px solid rgba(60,63,74,.08);
      user-select:none;
    }

    .cg-drawer-title{
      font-weight:1100;
      color: rgba(60,63,74,.88);
      display:flex;
      align-items:center;
      gap:8px;
      white-space:nowrap;
    }

    .cg-drawer-btn{
      border:none;
      background: rgba(255,255,255,.75);
      border: 1px solid rgba(60,63,74,.10);
      border-radius: 999px;
      padding: 6px 10px;
      font-weight: 1000;
      cursor:pointer;
      touch-action:manipulation;
      box-shadow: 0 8px 16px rgba(60,63,74,.08);
      line-height: 1;
      min-width: 44px;
    }
    .cg-drawer-btn:active{ transform: scale(.98); }

    .cg-drawer-body{
      padding: 10px;
      background: radial-gradient(circle at left,
        rgba(117,207,240,.10),
        rgba(172,148,244,.08),
        rgba(255,213,183,.10)
      );
      max-height: 48vh; /* open height */
      transition: max-height .18s ease, padding .18s ease;
      overflow: auto;   /* ✅ vertical scroll allowed */
      -webkit-overflow-scrolling: touch;
    }
    .cg-drawer.is-closed .cg-drawer-body{
      max-height: 0;
      padding-top: 0;
      padding-bottom: 0;
      overflow: hidden;
    }

    /* ✅ Grid: show ALL keys without sideways scroll */
    .cg-key-grid{
      display:grid;
      gap:10px;
      grid-template-columns: repeat(auto-fit, minmax(116px, 1fr));
    }

    .cg-key-btn{
      width: 100%;
      border-radius: 16px;
      border: 1px solid rgba(60,63,74,.10);
      background: rgba(255,255,255,.85);
      box-shadow: 0 10px 18px rgba(60,63,74,.08);
      padding: 10px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      cursor:pointer;
      touch-action:manipulation;
    }
    .cg-key-btn:active{ transform: scale(.99); }

    .cg-key-emoji{
      width: 38px;
      height: 38px;
      border-radius: 12px;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size: 1.08rem;
      background: rgba(255,213,183,.42);
      border: 1px solid rgba(60,63,74,.08);
      line-height:1;
      flex: 0 0 auto;
    }
    .cg-key-letter{
      width: 38px;
      height: 38px;
      border-radius: 12px;
      display:flex;
      align-items:center;
      justify-content:center;
      font-weight: 1100;
      font-size: 1.02rem;
      background: rgba(117,207,240,.12);
      border: 2px solid rgba(60,63,74,.10);
      color: rgba(60,63,74,.88);
      flex: 0 0 auto;
    }

    /* Confetti */
    .cg-confetti{
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 2000;
    }
    .cg-confetti-piece{
      position:absolute;
      width:10px;
      height:14px;
      border-radius:3px;
      opacity:.95;
      transform: translateY(-20px) rotate(0deg);
      animation: cgFall linear forwards;
    }
    @keyframes cgFall { to { transform: translateY(calc(100vh + 40px)) rotate(720deg); } }

    @media (max-width: 380px){
      :root{
        --cellW: 52px;
        --iconW: 30px;
        --letterH: 40px;
        --iconF: .95rem;
        --letterF: 1.03rem;
        --wordGap: 6px;
      }
      .cg-key-grid{ grid-template-columns: repeat(auto-fit, minmax(108px, 1fr)); }
    }
  </style>
</head>

<body>
  <div class="fc-game-screen">
    <a class="fc-back-link" href="../index.html">← Back to games</a>

    <div class="fc-game-box">
      <h1 class="fc-game-heading">Icon Cryptogram</h1>
      <p class="fc-game-instructions">
        Tap an icon in the key (drawer) to fill the next blank.
      </p>

      <div class="cg-controls">
        <button class="cg-btn cg-btn--primary" id="cgNewBtn" type="button">New Puzzle</button>
        <button class="cg-btn cg-btn--secondary" id="cgUndoBtn" type="button">Undo</button>
        <button class="cg-btn cg-btn--ghost" id="cgClearBtn" type="button">Clear</button>
        <button class="cg-btn cg-btn--secondary" id="cgResetWeekBtn" type="button">Reset Week</button>
      </div>

      <div class="cg-meta">
        <div class="cg-chip">🧩 Theme: <strong id="cgTheme">Mix</strong></div>
        <div class="cg-week" id="cgWeekText">Week</div>
      </div>

      <div class="cg-card">
        <div class="cg-card-head">
          <div>
            <h2 class="cg-card-title">🧩 The Secret Message</h2>
            <div class="cg-card-sub">Tap an icon in the drawer to fill the next blank.</div>
          </div>
          <div class="cg-progress"><span id="cgFilled">0</span> / <span id="cgTotal">0</span><br/>letters</div>
        </div>

        <div class="cg-message">
          <div class="cg-words" id="cgWords"></div>

          <div style="text-align:center;">
            <span class="cg-solved" id="cgSolved" style="display:none;">You solved it! 🎉</span>
          </div>

          <div class="cg-completed" id="cgCompleted" style="display:none;">
            <div style="font-weight:1100;">
              <span style="margin-right:6px;">✅</span>Completed This Week
              <span style="font-weight:900; color:rgba(60,63,74,.65); font-size:.92rem; margin-left:10px;" id="cgCompletedWeek"></span>
            </div>
            <div class="cg-pill" id="cgCompletedPhrase"></div>
          </div>
        </div>

        <div class="cg-status" id="cgStatus"></div>
      </div>
    </div>
  </div>

  <!-- Drawer for Icon Key -->
  <div class="cg-drawer" aria-label="Icon key drawer">
    <div class="cg-drawer-inner cg-drawer is-closed" id="cgDrawer">
      <div class="cg-drawer-head" id="cgDrawerHead">
        <div class="cg-drawer-title">🔑 Icon Key</div>
        <button class="cg-drawer-btn" id="cgDrawerToggle" type="button" aria-label="Toggle icon key drawer">⬆️</button>
      </div>
      <div class="cg-drawer-body" id="cgDrawerBody">
        <div class="cg-key-grid" id="cgKeyGrid" aria-label="Icon key grid"></div>
      </div>
    </div>
  </div>

  <div class="cg-confetti" id="cgConfetti"></div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // helpers
      function pad2(n){ return String(n).padStart(2,'0'); }
      function isoWeekKey(date){
        const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
        const dayNum = d.getUTCDay() || 7;
        d.setUTCDate(d.getUTCDate() + 4 - dayNum);
        const yearStart = new Date(Date.UTC(d.getUTCFullYear(),0,1));
        const weekNo = Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
        return `${d.getUTCFullYear()}-W${pad2(weekNo)}`;
      }
      const WEEK_KEY = isoWeekKey(new Date());

      function shuffle(arr){
        const a = arr.slice();
        for (let i = a.length - 1; i > 0; i--){
          const j = Math.floor(Math.random() * (i + 1));
          [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
      }

      // refs
      const wordsEl = document.getElementById('cgWords');
      const keyGridEl = document.getElementById('cgKeyGrid');
      const statusEl = document.getElementById('cgStatus');
      const filledEl = document.getElementById('cgFilled');
      const totalEl = document.getElementById('cgTotal');
      const solvedEl = document.getElementById('cgSolved');
      const themeEl = document.getElementById('cgTheme');
      const weekTextEl = document.getElementById('cgWeekText');

      const completedWrap = document.getElementById('cgCompleted');
      const completedWeekEl = document.getElementById('cgCompletedWeek');
      const completedPhraseEl = document.getElementById('cgCompletedPhrase');

      const newBtn = document.getElementById('cgNewBtn');
      const undoBtn = document.getElementById('cgUndoBtn');
      const clearBtn = document.getElementById('cgClearBtn');
      const resetWeekBtn = document.getElementById('cgResetWeekBtn');

      const confettiLayer = document.getElementById('cgConfetti');

      // drawer
      const drawer = document.getElementById('cgDrawer');
      const drawerHead = document.getElementById('cgDrawerHead');
      const drawerToggle = document.getElementById('cgDrawerToggle');
      let drawerOpen = false; // closed by default

      // data
      const PUZZLES = [
        { theme:'Encouragement', phrase:'GOD IS GOOD' },
        { theme:'Faith', phrase:'TRUST JEHOVAH' },
        { theme:'Kindness', phrase:'BE KIND' },
        { theme:'Love', phrase:'LOVE OTHERS' },
        { theme:'Prayer', phrase:'PRAY OFTEN' },
        { theme:'Bible', phrase:'READ THE BIBLE' },
        { theme:'Hope', phrase:'DO NOT GIVE UP' },
      ];

      const ICONS = [
        '🏠','🕯️','🏺','⛵','🛡️','🐑','🌿','👑','📜','🌊','🌟','🐟','🧺','🌳','🪙',
        '🍇','🍞','🐪','🫓','🪵','🔥','🫒','🧱','🪶','🦁','🕊️','⛰️','🏜️','⚓'
      ];

      // storage
      const STORAGE_PREFIX = 'fc_cryptogram_v7_';
      const STORAGE_KEY = STORAGE_PREFIX + WEEK_KEY;
      const COMPLETED_KEY = STORAGE_PREFIX + 'completed_' + WEEK_KEY;

      // state
      let current = null;
      let answer = [];
      let input = [];
      let cursor = 0;
      let history = [];
      let solved = false;

      function setStatus(t){ statusEl.textContent = t || ''; }

      function setDrawerOpen(open){
        drawerOpen = !!open;
        drawer.classList.toggle('is-closed', !drawerOpen);
        drawerToggle.textContent = drawerOpen ? '⬇️' : '⬆️';
        drawerToggle.setAttribute('aria-expanded', drawerOpen ? 'true' : 'false');
      }
      function toggleDrawer(){ setDrawerOpen(!drawerOpen); }

      drawerToggle.addEventListener('click', (e) => { e.stopPropagation(); toggleDrawer(); saveState(); });
      drawerHead.addEventListener('click', () => { toggleDrawer(); saveState(); });

      function confettiBurst(big=false){
        const pieceCount = big ? 120 : 60;
        const durationMin = big ? 1200 : 900;
        const durationMax = big ? 2200 : 1600;

        const colors = ['#75CFF0','#FFD5B7','#F3B840','#AC94F4','#FF8269','#FAF8F6'];
        for (let i = 0; i < pieceCount; i++){
          const p = document.createElement('div');
          p.className = 'cg-confetti-piece';
          p.style.background = colors[Math.floor(Math.random() * colors.length)];

          const x = Math.random() * window.innerWidth;
          const delay = Math.random() * 140;
          const duration = durationMin + Math.random() * (durationMax - durationMin);

          p.style.left = x + 'px';
          p.style.top = (-20 - Math.random() * 60) + 'px';
          p.style.animationDuration = duration + 'ms';
          p.style.animationDelay = delay + 'ms';

          const w = 7 + Math.random() * 7;
          const h = 9 + Math.random() * 9;
          p.style.width = w + 'px';
          p.style.height = h + 'px';

          confettiLayer.appendChild(p);
          setTimeout(() => p.remove(), duration + delay + 120);
        }
      }

      function pickPuzzle(){
        const last = current?.phrase;
        const pool = shuffle(PUZZLES);
        return pool.find(p => p.phrase !== last) || pool[0];
      }

      function buildMapping(phrase){
        const letters = Array.from(new Set(
          phrase.toUpperCase().split('').filter(ch => ch >= 'A' && ch <= 'Z')
        ));
        const icons = shuffle(ICONS).slice(0, Math.max(letters.length, 8));
        const map = {};
        letters.forEach((L, i) => { map[L] = icons[i % icons.length]; });
        return map;
      }

      function tokenize(phrase, mapping){
        const words = phrase.trim().toUpperCase().split(/\s+/).filter(Boolean);
        const tokens = [];
        let gi = 0;
        for (const w of words){
          const letters = [];
          for (const ch of w){
            if (ch < 'A' || ch > 'Z') continue;
            letters.push({ L: ch, icon: mapping[ch], globalIndex: gi });
            gi++;
          }
          if (letters.length) tokens.push({ word: w, letters });
        }
        return { tokens, totalLetters: gi };
      }

      function findNextBlank(startIdx){
        for (let i = startIdx; i < input.length; i++){
          if (input[i] === '') return i;
        }
        return -1;
      }

      function updateCounters(){
        const totalLetters = answer.length;
        const filledLetters = input.filter(x => x !== '').length;
        filledEl.textContent = String(filledLetters);
        totalEl.textContent = String(totalLetters);
      }

      function updateSolvedUI(){
        solvedEl.style.display = solved ? 'inline-block' : 'none';

        if (solved) {
          const phrase = current.phrase.toUpperCase();
          completedWrap.style.display = 'flex';
          completedWeekEl.textContent = WEEK_KEY;
          completedPhraseEl.textContent = phrase;

          try {
            const done = JSON.parse(localStorage.getItem(COMPLETED_KEY) || '[]');
            if (!done.includes(phrase)) {
              done.push(phrase);
              localStorage.setItem(COMPLETED_KEY, JSON.stringify(done));
            }
          } catch (e) {}
        } else {
          completedWrap.style.display = 'none';
        }
      }

      function applyResponsiveCellSize(){
        if (!current?.tokens?.length) return;

        const longest = Math.max(...current.tokens.map(t => t.letters.length));
        const msgBox = document.querySelector('.cg-message');
        const rect = msgBox ? msgBox.getBoundingClientRect() : null;

        const available = Math.max(220, (rect ? rect.width : window.innerWidth) - 24);
        const gap = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--wordGap')) || 7;

        const minCell = 42;
        const maxCell = 56;

        let target = Math.floor((available - (gap * (longest - 1))) / longest);
        if (!Number.isFinite(target)) target = maxCell;

        const cellW = Math.max(minCell, Math.min(maxCell, target));
        const iconW = Math.max(24, Math.min(32, Math.floor(cellW * 0.58)));
        const letterH = Math.max(32, Math.min(42, Math.floor(cellW * 0.76)));

        const iconF = (iconW <= 26) ? '.9rem' : '1.0rem';
        const letterF = (cellW <= 46) ? '1.0rem' : '1.08rem';

        document.documentElement.style.setProperty('--cellW', cellW + 'px');
        document.documentElement.style.setProperty('--iconW', iconW + 'px');
        document.documentElement.style.setProperty('--letterH', letterH + 'px');
        document.documentElement.style.setProperty('--iconF', iconF);
        document.documentElement.style.setProperty('--letterF', letterF);
      }

      function render(){
        wordsEl.innerHTML = '';
        weekTextEl.textContent = WEEK_KEY;

        applyResponsiveCellSize();

        current.tokens.forEach(tok => {
          const wrap = document.createElement('div');
          wrap.className = 'cg-word-wrap';

          const wEl = document.createElement('div');
          wEl.className = 'cg-word';

          tok.letters.forEach(cell => {
            const box = document.createElement('div');
            box.className = 'cg-cell';

            const icon = document.createElement('div');
            icon.className = 'cg-icon';
            icon.textContent = cell.icon;

            const lb = document.createElement('div');
            lb.className = 'cg-letter-box';
            lb.textContent = input[cell.globalIndex] || '';

            if (cell.globalIndex === cursor) lb.classList.add('cg-letter-box--active');
            if (input[cell.globalIndex] !== '') lb.classList.add('cg-letter-box--filled');

            box.appendChild(icon);
            box.appendChild(lb);
            wEl.appendChild(box);
          });

          wrap.appendChild(wEl);
          wordsEl.appendChild(wrap);
        });

        // rebuild key grid (no sideways scrolling now)
        keyGridEl.innerHTML = '';
        const mappingEntries = Object.entries(current.mapping).map(([letter, icon]) => ({ letter, icon }));
        const ordered = mappingEntries.sort((a,b) => a.icon.localeCompare(b.icon));

        ordered.forEach(({letter, icon}) => {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'cg-key-btn';
          btn.setAttribute('aria-label', `Icon ${icon}, letter ${letter}`);

          const e = document.createElement('div');
          e.className = 'cg-key-emoji';
          e.textContent = icon;

          const l = document.createElement('div');
          l.className = 'cg-key-letter';
          l.textContent = letter;

          btn.appendChild(e);
          btn.appendChild(l);

          btn.addEventListener('click', () => onKeyTap(letter));
          keyGridEl.appendChild(btn);
        });

        updateCounters();
        updateSolvedUI();
      }

      function saveState(){
        try {
          const data = { current, answer, input, cursor, history, solved, drawerOpen };
          localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
        } catch (e) {}
      }

      function loadState(){
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return false;
          const data = JSON.parse(raw);
          if (!data?.current?.phrase || !Array.isArray(data.answer) || !Array.isArray(data.input) || !Array.isArray(data.current.tokens)) return false;

          current = data.current;
          answer = data.answer;
          input = data.input;
          cursor = typeof data.cursor === 'number' ? data.cursor : 0;
          history = Array.isArray(data.history) ? data.history : [];
          solved = !!data.solved;

          setDrawerOpen(!!data.drawerOpen);

          if (!solved) {
            const next = findNextBlank(0);
            cursor = (next === -1) ? 0 : next;
          }
          return true;
        } catch (e) {
          return false;
        }
      }

      function startNewPuzzle(){
        solved = false;
        history = [];

        const p = pickPuzzle();
        themeEl.textContent = p.theme;

        const phrase = p.phrase.toUpperCase().trim();
        const mapping = buildMapping(phrase);
        const { tokens, totalLetters } = tokenize(phrase, mapping);

        current = { theme: p.theme, phrase, mapping, tokens };

        answer = new Array(totalLetters).fill('');
        tokens.forEach(tok => tok.letters.forEach(c => { answer[c.globalIndex] = c.L; }));
        input = new Array(totalLetters).fill('');

        cursor = findNextBlank(0);
        if (cursor === -1) cursor = 0;

        setStatus('Pick the matching icon to fill the next blank.');
        render();
        saveState();
      }

      function checkSolved(){
        for (let i = 0; i < answer.length; i++){
          if ((input[i] || '') !== answer[i]) return false;
        }
        return true;
      }

      function onKeyTap(letter){
        if (solved) { setStatus('Great job! Tap New Puzzle for another one.'); return; }

        if (cursor < 0 || cursor >= input.length || input[cursor] !== '') {
          const next = findNextBlank(0);
          cursor = next === -1 ? cursor : next;
        }
        if (cursor === -1) return;

        const isCorrect = (answer[cursor] === letter);
        if (!isCorrect){
          setStatus('Not quite — try a different icon 🙂');
          return;
        }

        history.push({ idx: cursor, prev: input[cursor] });
        input[cursor] = letter;

        const next = findNextBlank(cursor + 1);
        cursor = (next === -1) ? findNextBlank(0) : next;
        if (cursor === -1) cursor = 0;

        setStatus('Nice! Keep going 🙂');

        if (checkSolved()){
          solved = true;
          setStatus('You solved it! 🎉');
          confettiBurst(true);
        }

        render();
        saveState();
      }

      function undo(){
        if (history.length === 0) { setStatus('Nothing to undo.'); return; }
        if (solved) solved = false;

        const last = history.pop();
        input[last.idx] = last.prev || '';
        cursor = last.idx;

        setStatus('Undid the last letter.');
        render();
        saveState();
      }

      function clearAll(){
        if (!current) return;
        solved = false;
        history = [];
        input = new Array(answer.length).fill('');
        cursor = findNextBlank(0);
        if (cursor === -1) cursor = 0;
        setStatus('Cleared. Start again 🙂');
        render();
        saveState();
      }

      function resetWeek(){
        try {
          localStorage.removeItem(STORAGE_KEY);
          localStorage.removeItem(COMPLETED_KEY);
        } catch (e) {}
        setStatus('Week reset. New puzzle loaded.');
        startNewPuzzle();
      }

      newBtn.addEventListener('click', startNewPuzzle);
      undoBtn.addEventListener('click', undo);
      clearBtn.addEventListener('click', clearAll);
      resetWeekBtn.addEventListener('click', resetWeek);

      window.addEventListener('resize', () => {
        if (current) render();
      });

      // init
      setDrawerOpen(false);

      if (!loadState()){
        startNewPuzzle();
      } else {
        themeEl.textContent = current.theme || 'Mix';
        render();
        setStatus(solved ? 'You solved it! Tap New Puzzle for another.' : 'Pick the matching icon to fill the next blank.');
      }
    });
  </script>
</body>
</html>
