<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Icon Cryptogram – Faithful Companion Games</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="../styles.css" />

  <style>
    .fc-game-screen{
      min-height:100vh;
      background:var(--dove-white);
      display:flex;
      flex-direction:column;
      align-items:center;
      padding:16px;
    }
    .fc-game-box{
      margin-top:12px;
      width:100%;
      max-width:980px;
      border-radius:20px;
      background:#fff;
      box-shadow:0 4px 10px rgba(60,63,74,.15);
      padding:16px;
    }
    .fc-game-heading{
      margin:0 0 6px;
      font-size:1.4rem;
      color:var(--scripture-slate);
      text-align:center;
    }
    .fc-game-instructions{
      margin:0 0 12px;
      font-size:.95rem;
      color:rgba(60,63,74,.85);
      text-align:center;
    }

    .cg-top{
      display:flex;
      flex-wrap:wrap;
      gap:10px;
      justify-content:center;
      align-items:center;
      margin:10px 0 12px;
      padding:10px;
      border-radius:16px;
      background:radial-gradient(circle at left,
        rgba(117,207,240,.18),
        rgba(172,148,244,.10)
      );
    }
    .cg-btn{
      padding:9px 14px;
      border-radius:999px;
      border:none;
      cursor:pointer;
      font-weight:900;
      font-size:.95rem;
      box-shadow:0 3px 8px rgba(60,63,74,.2);
      touch-action:manipulation;
    }
    .cg-btn:active{ transform:scale(.98); }
    .cg-btn--primary{ background:var(--cheerful-coral); color:#fff; }
    .cg-btn--secondary{ background:rgba(172,148,244,.16); color:var(--scripture-slate); }

    .cg-layout{
      display:grid;
      grid-template-columns:1fr;
      gap:12px;
      align-items:start;
    }
    @media (min-width: 900px){
      .cg-layout{ grid-template-columns: 1.1fr .9fr; }
    }

    .cg-panel{
      border-radius:18px;
      padding:12px;
      background:radial-gradient(circle at top left,
        rgba(117,207,240,.14),
        rgba(172,148,244,.10)
      );
      box-shadow:0 3px 8px rgba(60,63,74,.12);
    }
    .cg-panel-title{
      margin:0 0 10px;
      font-size:1rem;
      font-weight:1000;
      color:var(--scripture-slate);
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
    }
    .cg-subtle{
      font-size:.85rem;
      font-weight:900;
      color:rgba(60,63,74,.70);
    }

    /* Phrase */
    .cg-phrase{
      border-radius:18px;
      background:#fff;
      border:1px solid rgba(60,63,74,.12);
      box-shadow:0 3px 10px rgba(60,63,74,.10);
      padding:12px;
    }
    .cg-phrase-line{
      display:flex;
      flex-wrap:wrap;
      gap:10px 8px;
      justify-content:center;
      align-items:flex-end;
    }

    .cg-tile{
      width:48px;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:flex-end;
      gap:6px;
      user-select:none;
      -webkit-user-select:none;
    }
    .cg-clue{
      width:44px;
      height:34px;
      border-radius:14px;
      display:flex;
      align-items:center;
      justify-content:center;
      background:rgba(255,213,183,.40);
      border:2px solid rgba(60,63,74,.10);
      font-size:1.2rem;
      line-height:1;
    }
    .cg-cell{
      width:44px;
      height:54px;
      border-radius:14px;
      display:flex;
      align-items:center;
      justify-content:center;
      font-weight:1000;
      font-size:1.25rem;
      background:rgba(250,248,246,.95);
      border:2px solid rgba(60,63,74,.12);
      color:var(--scripture-slate);
      user-select:none;
      -webkit-user-select:none;
      touch-action:manipulation;
    }
    .cg-space{
      width:18px;
      height:88px;
      background:transparent;
      border:none;
    }
    .cg-punct{
      width:18px;
      height:88px;
      background:transparent;
      border:none;
      font-size:1.25rem;
      opacity:.85;
      display:flex;
      align-items:flex-end;
      justify-content:center;
      padding-bottom:14px;
    }

    .cg-cell--active{
      border-color: rgba(117,207,240,.95);
      box-shadow: 0 0 0 4px rgba(117,207,240,.18);
      background: rgba(117,207,240,.10);
    }
    .cg-cell--correct{
      border-color: rgba(103,197,135,.65);
      background: rgba(103,197,135,.12);
    }

    .cg-status{
      margin-top:10px;
      text-align:center;
      font-weight:900;
      min-height:1.3em;
      color:rgba(60,63,74,.85);
    }
    .cg-win{
      display:inline-block;
      padding:8px 10px;
      border-radius:12px;
      background:rgba(103,197,135,.22);
      color:var(--scripture-slate);
      font-weight:1000;
    }

    /* Completed list */
    .cg-completed{
      margin-top:10px;
      border-radius:16px;
      background:rgba(250,248,246,.9);
      border:1px solid rgba(60,63,74,.12);
      padding:10px;
    }
    .cg-completed h3{
      margin:0 0 6px;
      font-size:.95rem;
      color:var(--scripture-slate);
      font-weight:1000;
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
    }
    .cg-completed small{
      color:rgba(60,63,74,.75);
      font-weight:900;
    }
    .cg-pill-row{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
      justify-content:center;
      margin-top:8px;
    }
    .cg-pill{
      padding:6px 10px;
      border-radius:999px;
      background:#fff;
      border:1px solid rgba(60,63,74,.12);
      box-shadow:0 2px 6px rgba(60,63,74,.10);
      font-weight:1000;
      color:var(--scripture-slate);
      font-size:.9rem;
      max-width:100%;
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
    }

    /* Key */
    .cg-key-wrap{
      border-radius:18px;
      background:#fff;
      border:1px solid rgba(60,63,74,.12);
      box-shadow:0 3px 10px rgba(60,63,74,.10);
      overflow:hidden;
    }
    .cg-key-header{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
      padding:10px 12px;
      background:rgba(255,213,183,.55);
      font-weight:1000;
      color:var(--scripture-slate);
    }
    .cg-key-scroll{
      max-height:320px;
      overflow:auto;
      padding:10px;
      -webkit-overflow-scrolling: touch;
    }
    .cg-key-grid{
      display:grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap:10px;
    }
    @media (min-width:520px){
      .cg-key-grid{ grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }
    .cg-key-btn{
      border:none;
      cursor:pointer;
      border-radius:16px;
      padding:10px 10px;
      background:radial-gradient(circle at top left,
        rgba(117,207,240,.16),
        rgba(172,148,244,.10)
      );
      box-shadow:0 3px 8px rgba(60,63,74,.12);
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:6px;
      font-weight:1000;
      color:var(--scripture-slate);
      touch-action:manipulation;
      user-select:none;
      -webkit-user-select:none;
      min-height:76px;
    }
    .cg-key-btn:active{ transform:scale(.98); }
    .cg-key-icon{ font-size:1.6rem; line-height:1; }
    .cg-key-letter{
      font-size:.95rem;
      background:#fff;
      border:1px solid rgba(60,63,74,.12);
      border-radius:999px;
      padding:2px 10px;
    }

    /* Confetti */
    .cg-confetti{
      position:fixed;
      inset:0;
      pointer-events:none;
      z-index:9999;
      overflow:hidden;
    }
    .cg-confetti-piece{
      position:absolute;
      width:8px;
      height:12px;
      border-radius:3px;
      opacity:.95;
      animation: cgFall linear forwards;
    }
    @keyframes cgFall{
      to { transform: translateY(110vh) rotate(720deg); }
    }

    @media (max-width:420px){
      .cg-tile{ width:44px; }
      .cg-clue{ width:40px; height:32px; font-size:1.1rem; }
      .cg-cell{ width:40px; height:52px; font-size:1.18rem; }
      .cg-space, .cg-punct{ height:84px; }
      .cg-key-btn{ min-height:72px; }
      .cg-key-icon{ font-size:1.45rem; }
    }
  </style>
</head>

<body>
  <div class="fc-game-screen">
    <a class="fc-back-link" href="../index.html">Back to games</a>

    <div class="fc-game-box">
      <h1 class="fc-game-heading">Icon Cryptogram</h1>
      <p class="fc-game-instructions">
        Look at the icon clues above the blanks. Find the same icon in the key, then tap it to fill the next blank.
      </p>

      <div class="cg-top">
        <button class="cg-btn cg-btn--primary" id="cgNewBtn" type="button">New Puzzle</button>
        <button class="cg-btn cg-btn--secondary" id="cgUndoBtn" type="button">Undo</button>
        <button class="cg-btn cg-btn--secondary" id="cgClearBtn" type="button">Clear</button>
        <button class="cg-btn cg-btn--secondary" id="cgResetWeekBtn" type="button">Reset Week</button>
      </div>

      <div class="cg-layout">
        <div class="cg-panel">
          <div class="cg-panel-title">
            <span>🧩 The Secret Message</span>
            <span class="cg-subtle" id="cgProgress"></span>
          </div>

          <div class="cg-phrase" aria-label="Cryptogram phrase">
            <div class="cg-phrase-line" id="cgPhraseLine"></div>
            <div class="cg-status" id="cgStatus"></div>

            <div class="cg-completed" aria-label="Completed phrases">
              <h3>
                <span>✅ Completed This Week</span>
                <small id="cgWeekLabel"></small>
              </h3>
              <div class="cg-pill-row" id="cgCompletedRow"></div>
            </div>
          </div>
        </div>

        <div class="cg-panel">
          <div class="cg-panel-title">
            <span>🔑 Icon Key</span>
            <span class="cg-subtle">(tap an icon)</span>
          </div>

          <div class="cg-key-wrap">
            <div class="cg-key-header">
              <span>Pick the matching icon</span>
              <span style="font-size:.85rem; opacity:.85;">(scroll)</span>
            </div>
            <div class="cg-key-scroll">
              <div class="cg-key-grid" id="cgKeyGrid"></div>
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>

  <div class="cg-confetti" id="cgConfetti"></div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // ✅ Add/replace phrases anytime (simple, kid-friendly)
      const PHRASES = [
        { text: 'JEHOVAH LOVES YOU' },
        { text: 'LISTEN AND OBEY' },
        { text: 'PRAY EVERY DAY' },
        { text: 'BE KIND' },
        { text: 'JESUS HELPS US' },
        { text: 'GOD IS GOOD' },
        { text: 'SAY THANK YOU' },
        { text: 'LOVE ONE ANOTHER' }
      ];

      const LETTERS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
      const ICONS = [
        '🐑','🕊️','⭐','🌿','🍞','🏺','📜','🧺','🪙','🕯️','🧱','🌳','🐟',
        '🛶','🧭','🪴','👑','🧡','🛡️','⛵','🐫','🪵','🌊','🏠','🪶','🧸'
      ];
      while (ICONS.length < 26) ICONS.push('✨');

      const newBtn = document.getElementById('cgNewBtn');
      const undoBtn = document.getElementById('cgUndoBtn');
      const clearBtn = document.getElementById('cgClearBtn');
      const resetWeekBtn = document.getElementById('cgResetWeekBtn');

      const phraseLineEl = document.getElementById('cgPhraseLine');
      const statusEl = document.getElementById('cgStatus');
      const progressEl = document.getElementById('cgProgress');
      const keyGridEl = document.getElementById('cgKeyGrid');
      const confettiLayer = document.getElementById('cgConfetti');

      const completedRowEl = document.getElementById('cgCompletedRow');
      const weekLabelEl = document.getElementById('cgWeekLabel');

      // Weekly storage keys
      const STORAGE_WEEK_KEY = 'fc_crypto_week_id_v1';
      const STORAGE_DONE_KEY = 'fc_crypto_done_v1';

      // State
      let answer = '';
      let slots = [];       // [{type, char, value, cellEl, clueEl}]
      let activeIndex = -1;
      let history = [];

      // Mappings
      let iconForLetter = {}; // letter -> icon
      let letterForIcon = {}; // icon -> letter

      function shuffle(arr){
        const a = arr.slice();
        for (let i = a.length - 1; i > 0; i--){
          const j = Math.floor(Math.random() * (i + 1));
          [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
      }

      function setStatus(text, isWin=false){
        if (isWin) statusEl.innerHTML = `<span class="cg-win">${text}</span>`;
        else statusEl.textContent = text || '';
      }

      function confettiBurst(count=80){
        const colors = ['#75CFF0','#FFD5B7','#F3B840','#AC94F4','#FF8269'];
        for (let i = 0; i < count; i++){
          const p = document.createElement('div');
          p.className = 'cg-confetti-piece';
          p.style.background = colors[Math.floor(Math.random()*colors.length)];
          p.style.left = (Math.random()*100) + 'vw';
          p.style.top = (-20 - Math.random()*60) + 'px';
          p.style.animationDuration = (900 + Math.random()*900) + 'ms';
          confettiLayer.appendChild(p);
          setTimeout(() => p.remove(), 2200);
        }
      }

      function normalizeText(t){
        return t.toUpperCase().replace(/[^A-Z\s\.\,\!\?\-']/g, '');
      }

      // ===== Weekly reset logic =====
      // Week ID: "YYYY-WW" (ISO week number)
      function getISOWeekId(date = new Date()){
        const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
        const dayNum = d.getUTCDay() || 7;
        d.setUTCDate(d.getUTCDate() + 4 - dayNum);
        const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
        const weekNo = Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
        const y = d.getUTCFullYear();
        const w = String(weekNo).padStart(2, '0');
        return `${y}-W${w}`;
      }

      function ensureCurrentWeek(){
        const currentWeek = getISOWeekId();
        const storedWeek = localStorage.getItem(STORAGE_WEEK_KEY);

        if (storedWeek !== currentWeek){
          localStorage.setItem(STORAGE_WEEK_KEY, currentWeek);
          localStorage.setItem(STORAGE_DONE_KEY, JSON.stringify([]));
        }
        weekLabelEl.textContent = currentWeek;
      }

      function getCompletedList(){
        try{
          const raw = localStorage.getItem(STORAGE_DONE_KEY);
          const arr = raw ? JSON.parse(raw) : [];
          return Array.isArray(arr) ? arr : [];
        } catch {
          return [];
        }
      }

      function setCompletedList(arr){
        localStorage.setItem(STORAGE_DONE_KEY, JSON.stringify(arr));
      }

      function renderCompleted(){
        const done = getCompletedList();
        completedRowEl.innerHTML = '';

        if (!done.length){
          const empty = document.createElement('div');
          empty.className = 'cg-subtle';
          empty.style.textAlign = 'center';
          empty.style.width = '100%';
          empty.textContent = 'No completed messages yet 🙂';
          completedRowEl.appendChild(empty);
          return;
        }

        done.slice().reverse().forEach(txt => {
          const pill = document.createElement('div');
          pill.className = 'cg-pill';
          pill.title = txt;
          pill.textContent = txt;
          completedRowEl.appendChild(pill);
        });
      }

      function addCompleted(text){
        const clean = normalizeText(text);
        let done = getCompletedList();
        if (!done.includes(clean)){
          done.push(clean);
          setCompletedList(done);
          renderCompleted();
        }
      }

      function resetWeek(){
        const currentWeek = getISOWeekId();
        localStorage.setItem(STORAGE_WEEK_KEY, currentWeek);
        localStorage.setItem(STORAGE_DONE_KEY, JSON.stringify([]));
        ensureCurrentWeek();
        renderCompleted();
        setStatus('Weekly progress reset.');
      }

      // ===== Puzzle build =====
      function buildKey(){
        keyGridEl.innerHTML = '';

        const shuffledIcons = shuffle(ICONS);
        iconForLetter = {};
        letterForIcon = {};

        for (let i = 0; i < 26; i++){
          const letter = LETTERS[i];
          const icon = shuffledIcons[i];
          iconForLetter[letter] = icon;
          letterForIcon[icon] = letter;
        }

        const order = shuffle(LETTERS);
        order.forEach((letter) => {
          const icon = iconForLetter[letter];

          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'cg-key-btn';

          const iconEl = document.createElement('div');
          iconEl.className = 'cg-key-icon';
          iconEl.textContent = icon;

          const chip = document.createElement('div');
          chip.className = 'cg-key-letter';
          chip.textContent = letter;

          btn.appendChild(iconEl);
          btn.appendChild(chip);

          btn.addEventListener('click', () => placeLetter(letter));
          keyGridEl.appendChild(btn);
        });
      }

      function buildPhraseSlots(text){
        phraseLineEl.innerHTML = '';
        slots = [];
        history = [];

        const t = normalizeText(text);
        answer = t;

        for (let i = 0; i < t.length; i++){
          const ch = t[i];

          if (ch === ' '){
            const sp = document.createElement('div');
            sp.className = 'cg-space';
            phraseLineEl.appendChild(sp);
            slots.push({ type:'space', char:' ', value:' ' });
            continue;
          }

          if (!/[A-Z]/.test(ch)){
            const p = document.createElement('div');
            p.className = 'cg-punct';
            p.textContent = ch;
            phraseLineEl.appendChild(p);
            slots.push({ type:'punct', char:ch, value:ch });
            continue;
          }

          const tile = document.createElement('div');
          tile.className = 'cg-tile';

          const clue = document.createElement('div');
          clue.className = 'cg-clue';
          clue.textContent = iconForLetter[ch] || '❓';

          const cell = document.createElement('button');
          cell.type = 'button';
          cell.className = 'cg-cell';
          cell.textContent = '—';
          cell.dataset.index = String(slots.length);

          cell.addEventListener('click', () => {
            const idx = Number(cell.dataset.index);
            if (Number.isFinite(idx) && slots[idx]?.type === 'letter'){
              setActiveIndex(idx);
            }
          });

          tile.appendChild(clue);
          tile.appendChild(cell);
          phraseLineEl.appendChild(tile);

          slots.push({ type:'letter', char:ch, value:'', cellEl: cell, clueEl: clue });
        }

        const first = slots.findIndex(s => s.type === 'letter' && !s.value);
        setActiveIndex(first);
        updateProgress();
      }

      function setActiveIndex(idx){
        slots.forEach(s => s.cellEl?.classList?.remove?.('cg-cell--active'));
        activeIndex = idx;
        if (activeIndex >= 0 && slots[activeIndex]?.type === 'letter'){
          slots[activeIndex].cellEl.classList.add('cg-cell--active');
        }
      }

      function findNextBlank(fromIndex){
        for (let i = fromIndex; i < slots.length; i++){
          if (slots[i].type === 'letter' && !slots[i].value) return i;
        }
        for (let i = 0; i < fromIndex; i++){
          if (slots[i].type === 'letter' && !slots[i].value) return i;
        }
        return -1;
      }

      function updateProgress(){
        const total = slots.filter(s => s.type === 'letter').length;
        const filled = slots.filter(s => s.type === 'letter' && s.value).length;
        progressEl.textContent = `${filled} / ${total} letters`;

        if (total > 0 && filled === total){
          const solved = slots.filter(s => s.type === 'letter').every(s => s.value === s.char);

          if (solved){
            setStatus('You solved it! 🎉', true);
            confettiBurst(120);

            // ✅ save as completed for this week
            addCompleted(answer);

          } else {
            setStatus('Almost! Some letters need fixing 🙂');
          }
        }
      }

      function placeLetter(letter){
        if (activeIndex < 0){
          setStatus('All letters are filled! Tap a letter box to change where you type.');
          return;
        }

        const slot = slots[activeIndex];
        if (!slot || slot.type !== 'letter') return;

        slot.value = letter;
        slot.cellEl.textContent = letter;

        slot.cellEl.classList.remove('cg-cell--correct');
        if (letter === slot.char){
          slot.cellEl.classList.add('cg-cell--correct');
          setStatus('Nice match! ✅');
        } else {
          setStatus('Try a different icon 🙂');
          slot.cellEl.animate(
            [{ transform:'translateX(0)' },{ transform:'translateX(-4px)' },{ transform:'translateX(4px)' },{ transform:'translateX(0)' }],
            { duration: 220, easing: 'ease-in-out' }
          );
        }

        history.push(activeIndex);

        const next = findNextBlank(activeIndex + 1);
        setActiveIndex(next);
        updateProgress();
      }

      function undo(){
        if (!history.length){
          setStatus('Nothing to undo.');
          return;
        }
        const idx = history.pop();
        const slot = slots[idx];
        if (!slot || slot.type !== 'letter') return;

        slot.value = '';
        slot.cellEl.textContent = '—';
        slot.cellEl.classList.remove('cg-cell--correct');
        setActiveIndex(idx);

        setStatus('Undone.');
        updateProgress();
      }

      function clearAll(){
        slots.forEach((s) => {
          if (s.type === 'letter'){
            s.value = '';
            s.cellEl.textContent = '—';
            s.cellEl.classList.remove('cg-cell--correct');
          }
        });
        history = [];
        const first = slots.findIndex(s => s.type === 'letter' && !s.value);
        setActiveIndex(first);
        setStatus('Cleared. Start again!');
        updateProgress();
      }

      // ✅ random phrase selection (no dropdown)
      function pickNewPhrase(){
        const done = getCompletedList();
        const remaining = PHRASES
          .map(p => normalizeText(p.text))
          .filter(t => !done.includes(t));

        // If all done this week, allow repeats (or keep only remaining empty)
        if (!remaining.length){
          const any = PHRASES[Math.floor(Math.random() * PHRASES.length)];
          return any.text;
        }

        const chosenText = remaining[Math.floor(Math.random() * remaining.length)];
        return chosenText;
      }

      function newPuzzle(){
        buildKey(); // mapping must be built before clues
        const text = pickNewPhrase();
        buildPhraseSlots(text);
        setStatus('Match the icons to fill the message!');
      }

      // Events
      newBtn.addEventListener('click', newPuzzle);
      undoBtn.addEventListener('click', undo);
      clearBtn.addEventListener('click', clearAll);
      resetWeekBtn.addEventListener('click', resetWeek);

      // Init
      ensureCurrentWeek();
      renderCompleted();
      newPuzzle();
    });
  </script>
