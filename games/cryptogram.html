<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Icon Cryptogram – Faithful Companion Games</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="../styles.css" />

  <style>
    :root{
      --bg: var(--dove-white, #FAF8F6);
      --ink: var(--scripture-slate, #3C3F4A);
      --sky: var(--spiritual-sky, #75CFF0);
      --violet: var(--faithful-violet, #AC94F4);
      --peach: var(--joyful-peach, #FFD5B7);
      --gold: var(--golden-promise, #F3B840);
      --coral: var(--cheerful-coral, #FF8269);
      --card: #fff;
      --line: rgba(60,63,74,.12);

      /* cell sizing defaults (JS updates these) */
      --cellW: 72px;
      --iconW: 44px;
      --letterH: 54px;
      --iconF: 1.25rem;
      --letterF: 1.25rem;

      /* word row gap */
      --wordGap: 10px;
    }

    body{
      margin:0;
      background: var(--bg);
      color: var(--ink);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      overflow-x:hidden;
    }

    .fc-game-screen{
      min-height:100vh;
      display:flex;
      flex-direction:column;
      align-items:center;
      padding:16px;
      /* room for sticky key */
      padding-bottom: calc(16px + env(safe-area-inset-bottom) + 150px);
      box-sizing:border-box;
    }

    .fc-back-link{
      align-self:flex-start;
      text-decoration:none;
      font-weight:900;
      color: rgba(255,130,105,.85);
      padding:8px 10px;
      border-radius:999px;
      background: rgba(255,213,183,.35);
      border: 1px solid rgba(60,63,74,.10);
    }

    .fc-game-box{
      width:100%;
      max-width:980px;
      margin-top:12px;
      border-radius:22px;
      background: var(--card);
      border:1px solid var(--line);
      box-shadow: 0 6px 18px rgba(60,63,74,.10);
      padding:16px;
      box-sizing:border-box;
    }

    .fc-game-heading{
      margin: 6px 0 4px;
      font-size: 1.65rem;
      font-weight: 1000;
      text-align:center;
    }
    .fc-game-instructions{
      margin:0 0 14px;
      text-align:center;
      color: rgba(60,63,74,.78);
      font-weight:650;
      line-height:1.25;
    }

    .cg-controls{
      display:flex;
      flex-wrap:wrap;
      gap:10px;
      justify-content:center;
      align-items:center;
      margin:12px 0 14px;
      padding:12px;
      border-radius:18px;
      background: radial-gradient(circle at left,
        rgba(117,207,240,.18),
        rgba(172,148,244,.12),
        rgba(255,213,183,.22)
      );
      border: 1px solid rgba(60,63,74,.08);
    }
    .cg-btn{
      padding:10px 16px;
      border-radius:999px;
      border:none;
      cursor:pointer;
      font-weight:900;
      font-size:.98rem;
      box-shadow:0 6px 16px rgba(60,63,74,.14);
      touch-action:manipulation;
    }
    .cg-btn:active{ transform: scale(.98); }
    .cg-btn--primary{ background: var(--coral); color:#fff; }
    .cg-btn--secondary{ background: rgba(172,148,244,.18
