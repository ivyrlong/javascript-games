<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Special Event – Faithful Companion</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="../styles.css" />

  <style>
    .fc-body{
      margin:0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: var(--dove-white, #FAF8F6);
      color: var(--scripture-slate, #3C3F4A);
    }
    .fc-app-shell{ min-height:100vh; display:flex; flex-direction:column; }

    .sec-header{
      padding:14px 16px 10px;
      background: radial-gradient(circle at top left,
        rgba(117,207,240,.22),
        rgba(172,148,244,.14),
        rgba(255,213,183,.20)
      );
      border-bottom:1px solid rgba(60,63,74,.10);
    }
    .sec-header-inner{
      max-width:980px;
      margin:0 auto;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
    }
    .sec-titlewrap{ display:flex; gap:12px; align-items:center; }
    .sec-icon{
      width:44px; height:44px; border-radius:14px;
      display:flex; align-items:center; justify-content:center;
      font-size:1.45rem;
      background: radial-gradient(circle at top left,
        rgba(117,207,240,.22),
        rgba(172,148,244,.14),
        rgba(255,213,183,.22)
      );
      border:1px solid rgba(60,63,74,.10);
      box-shadow:0 6px 18px rgba(60,63,74,.12);
      flex:0 0 auto;
    }
    .sec-title{ margin:0; font-size:1.2rem; line-height:1.1; font-weight:950; }
    .sec-sub{ margin:4px 0 0; font-size:.95rem; color:rgba(60,63,74,.72); font-weight:650; }

    .sec-main{
      max-width:980px;
      width:100%;
      margin:0 auto;
      padding:14px 16px 88px;
      flex:1;
    }

    .top-actions{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      justify-content:center;
      margin:10px 0 14px;
    }
    .fc-pillbtn{
      border:1px solid rgba(60,63,74,.14);
      background:#fff;
      border-radius:999px;
      padding:9px 14px;
      font-weight:900;
      color:rgba(60,63,74,.75);
      text-decoration:none;
      box-shadow:0 6px 16px rgba(60,63,74,.08);
      touch-action:manipulation;
      display:inline-flex;
      align-items:center;
      gap:8px;
    }
    .fc-pillbtn:active{ transform:scale(.99); }

    .wh-list{ display:flex; flex-direction:column; gap:12px; }

    .wh-row{
      display:flex;
      gap:12px;
      align-items:center;
      background:#fff;
      border:1px solid rgba(60,63,74,.12);
      border-radius:18px;
      padding:12px 12px;
      box-shadow:0 6px 18px rgba(60,63,74,.08);
      text-decoration:none;
      color:inherit;
      touch-action:manipulation;
      transition: transform 120ms ease, box-shadow 120ms ease;
      position:relative;
    }
    .wh-row:active{ transform:scale(.99); }

    .wh-thumb{
      width:54px; height:54px;
      border-radius:14px;
      display:flex;
      align-items:center;
      justify-content:center;
      flex:0 0 auto;
      border:1px solid rgba(60,63,74,.10);
      box-shadow:0 6px 14px rgba(60,63,74,.10);
      background: radial-gradient(circle at top left,
        rgba(117,207,240,.22),
        rgba(172,148,244,.14),
        rgba(255,213,183,.22)
      );
      font-size:1.55rem;
    }
    .wh-row-main{ flex:1; min-width:0; }
    .wh-row-title{ margin:0; font-weight:950; font-size:1.05rem; }
    .wh-row-sub{
      margin:4px 0 0;
      font-size:.92rem;
      color:rgba(60,63,74,.72);
      font-weight:650;
      line-height:1.2;
    }
    .wh-chevron{
      font-size:1.6rem;
      color:rgba(60,63,74,.40);
      font-weight:900;
      padding:0 4px;
    }

    .wh-done-dot{
      position:absolute;
      right:44px;
      top:16px;
      width:10px; height:10px;
      border-radius:999px;
      background: rgba(60,63,74,.18);
    }
    .wh-done-dot--on{
      background: var(--cheerful-coral,#FF8269);
      box-shadow:0 0 0 3px rgba(255,130,105,.18);
    }

    .note{
      margin:12px 0 0;
      text-align:center;
      font-size:.9rem;
      font-weight:700;
      color:rgba(60,63,74,.70);
    }

    .fc-footer{
      position:fixed; left:0; right:0; bottom:0;
      background:#fff;
      border-top:1px solid rgba(60,63,74,.10);
      padding:10px 12px;
      display:flex;
      justify-content:center;
      gap:12px;
      z-index:999;
    }
    .fc-footer-btn{
      border:none;
      background:transparent;
      display:flex;
      align-items:center;
      gap:8px;
      font-weight:900;
      color: rgba(60,63,74,.72);
      padding:8px 14px;
      border-radius:999px;
      text-decoration:none;
      touch-action:manipulation;
    }
    .fc-footer-dot{
      width:10px; height:10px; border-radius:999px;
      background: rgba(60,63,74,.22);
    }
    .fc-footer-dot--active{ background: var(--cheerful-coral,#FF8269); }
  </style>
</head>

<body class="fc-body">
  <div class="fc-app-shell">
    <header class="sec-header">
      <div class="sec-header-inner">
        <div class="sec-titlewrap">
          <div class="sec-icon" id="eventIcon">⭐</div>
          <div>
            <h1 class="sec-title" id="eventTitle">Special Event</h1>
            <p class="sec-sub" id="eventSub">Activities for this occasion.</p>
          </div>
        </div>
      </div>
    </header>

    <main class="sec-main">
      <div class="top-actions">
        <a class="fc-pillbtn" href="./index.html">← Back to Special</a>
        <button class="fc-pillbtn" id="resetEventBtn" type="button">Reset this event</button>
      </div>

      <section class="wh-list" id="eventList" aria-label="Event activities"></section>

      <p class="note" id="eventNote"></p>
    </main>

    <nav class="fc-footer" aria-label="Bottom navigation">
      <a class="fc-footer-btn" href="../index.html">
        <span class="fc-footer-dot"></span>
        <span>Games</span>
      </a>
      <a class="fc-footer-btn" href="../weekly/index.html">
        <span class="fc-footer-dot"></span>
        <span>Weekly Hub</span>
      </a>
      <a class="fc-footer-btn" href="./index.html" aria-current="page">
        <span class="fc-footer-dot fc-footer-dot--active"></span>
        <span>Special</span>
      </a>
    </nav>
  </div>

  <script>
    // ----------------------------
    // 1) Event definitions (edit anytime)
    // ----------------------------
    const EVENTS = {
      "memorial-2026": {
        title: "Memorial",
        icon: "🕯️",
        sub: "Simple activities for reflection and preparation.",
        items: [
          { key: "ql",  icon:"👂✨", title:"Quiet Listeners (Memorial)", sub:"Count special words during the talk.", href:"../games/quiet_listeners.html" },
          { key: "wss", icon:"🗓️📌", title:"Weekly Scripture Saver (Memorial)", sub:"Save scriptures you want to remember.", href:"../games/weekly_scripture_saver.html" },
          { key: "cg",  icon:"🔎🧩", title:"Cryptogram", sub:"Reveal a simple encouragement message.", href:"../games/cryptogram.html" },
        ]
      },

      "circuit-assembly-2026": {
        title: "Circuit Assembly",
        icon: "🎤",
        sub: "Listening + learning games for the day.",
        items: [
          { key: "ql",  icon:"👂✨", title:"Quiet Listeners (Assembly)", sub:"Count key words during a talk.", href:"../games/quiet_listeners.html" },
          { key: "wss", icon:"🗓️📌", title:"Weekly Scripture Saver (Assembly)", sub:"Save scriptures from the program.", href:"../games/weekly_scripture_saver.html" },
          { key: "cw",  icon:"✍️🗺️", title:"Crossword", sub:"Review key words from the program.", href:"../games/crossword.html" },
        ]
      },

      "regional-convention-2026": {
        title: "Regional Convention",
        icon: "🏟️",
        sub: "A hub for convention activities (we can split by day next).",
        items: [
          { key: "ql",  icon:"👂✨", title:"Quiet Listeners (Convention)", sub:"Count words during a session.", href:"../games/quiet_listeners.html" },
          { key: "wss", icon:"🗓️📌", title:"Scripture Saver (Convention)", sub:"Save scriptures you hear.", href:"../games/weekly_scripture_saver.html" },
          { key: "hm",  icon:"🧍‍♂️🔤", title:"Hangman", sub:"Guess a lesson word.", href:"../games/hangman.html" },
        ]
      },

      "co-visit": {
        title: "CO Visit",
        icon: "🤝",
        sub: "Extra encouragement activities for the week.",
        items: [
          { key: "wss", icon:"🗓️📌", title:"Scripture Saver (CO Visit)", sub:"Save encouragement scriptures.", href:"../games/weekly_scripture_saver.html" },
          { key: "bbm", icon:"📖🔗", title:"Bible Books Match", sub:"Practice Bible navigation.", href:"../games/bible_books_match.html" },
        ]
      },

      "special-campaign": {
        title: "Special Campaign",
        icon: "📣",
        sub: "Campaign activities and practice.",
        items: [
          { key: "ql", icon:"👂✨", title:"Quiet Listeners (Campaign)", sub:"Listen for key campaign words.", href:"../games/quiet_listeners.html" },
          { key: "cg", icon:"🔎🧩", title:"Cryptogram", sub:"Decode a simple campaign thought.", href:"../games/cryptogram.html" },
        ]
      }
    };

    // ----------------------------
    // 2) Progress storage (per event)
    // ----------------------------
    const DONE_KEY_PREFIX = "fc_special_done:"; // + eventId
    function getDone(eventId){
      return JSON.parse(localStorage.getItem(DONE_KEY_PREFIX + eventId) || "{}");
    }
    function setDone(eventId, data){
      localStorage.setItem(DONE_KEY_PREFIX + eventId, JSON.stringify(data));
    }
    function markDone(eventId, itemKey){
      const d = getDone(eventId);
      d[itemKey] = true;
      setDone(eventId, d);
    }

    // ----------------------------
    // 3) Helpers
    // ----------------------------
    function getEventId(){
      const params = new URLSearchParams(location.search);
      return params.get("event") || "memorial-2026";
    }

    function makeRow(item, isComplete){
      const a = document.createElement("a");
      a.className = "wh-row";
      a.href = item.href;
      a.setAttribute("data-activity", item.key);

      a.innerHTML = `
        <div class="wh-thumb">${item.icon}</div>
        <div class="wh-row-main">
          <h2 class="wh-row-title">${item.title}</h2>
          <p class="wh-row-sub">${item.sub}</p>
        </div>
        <span class="wh-done-dot ${isComplete ? "wh-done-dot--on" : ""}" data-dot="${item.key}" aria-hidden="true"></span>
        <div class="wh-chevron">›</div>
      `;
      return a;
    }

    // ----------------------------
    // 4) Render
    // ----------------------------
    const eventId = getEventId();
    const cfg = EVENTS[eventId];

    const titleEl = document.getElementById("eventTitle");
    const iconEl = document.getElementById("eventIcon");
    const subEl = document.getElementById("eventSub");
    const listEl = document.getElementById("eventList");
    const noteEl = document.getElementById("eventNote");
    const resetBtn = document.getElementById("resetEventBtn");

    if (!cfg){
      titleEl.textContent = "Special Event";
      iconEl.textContent = "⭐";
      subEl.textContent = "This event wasn’t found yet.";
      noteEl.textContent = "Check your link or add this event in special/event.html.";
    } else {
      document.title = `${cfg.title} – Faithful Companion`;
      titleEl.textContent = cfg.title;
      iconEl.textContent = cfg.icon || "⭐";
      subEl.textContent = cfg.sub || "";

      const done = getDone(eventId);

      listEl.innerHTML = "";
      cfg.items.forEach(item => {
        const row = makeRow(item, !!done[item.key]);

        // Mark done automatically when they open the activity
        row.addEventListener("click", () => {
          markDone(eventId, item.key);
          // update dot right away
          const dot = row.querySelector(`[data-dot="${item.key}"]`);
          if (dot) dot.classList.add("wh-done-dot--on");
        });

        listEl.appendChild(row);
      });

      const completed = Object.values(done).filter(Boolean).length;
      noteEl.textContent = completed ? `✅ ${completed} activity${completed===1?"":"ies"} opened for this event.` : "";
    }

    resetBtn.addEventListener("click", () => {
      if (!cfg) return;
      const ok = confirm("Reset progress for this event?");
      if (!ok) return;
      localStorage.removeItem(DONE_KEY_PREFIX + eventId);
      location.reload();
    });
  </script>
</body>
</html>
